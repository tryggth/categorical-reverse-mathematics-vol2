[spec]
statement = "Over any commutative ring R ([CommRing R]), nonemptiness of the point-set prime spectrum { P : Ideal R // P.IsPrime } is logically equivalent to nontriviality of R via Krull's theorem (Ideal.exists_le_maximal and Ideal.IsMaximal.isPrime). In contrast to the axiom-free constructive Zariski frame (ch04:prop:zariski-radical-frame-constructive), extracting a global prime point crosses into the Crimson Classical.choice stratum ([propext, Classical.choice, Quot.sound])."
hypotheses = [
  "R : Type u with [CommRing R]",
  "Krull maximal ideal existence via Zorn's Lemma (Classical.choice)"
]

[spec.mathlib]
module = "HomotopyCRM.Vol2.SchemeResiduum"
imports = ["Mathlib.RingTheory.Ideal.Maximal"]
decl_names = [
  "HomotopyCRM.Vol2.prime_spectrum_krull_choice_gate"
]
expected_axioms = ["Classical.choice", "Quot.sound", "propext"]
lean_signature = """
/-- **Krull Prime-Spectrum Choice Gate (Crimson):**
    Inhabitation of the point-set prime spectrum `Spec R` is equivalent to `Nontrivial R`,
    crossing into the Crimson `Classical.choice` stratum via Zorn/Krull maximal ideals. -/
theorem prime_spectrum_krull_choice_gate (R : Type u) [CommRing R] :
    Nonempty { P : Ideal R // P.IsPrime } ↔ Nontrivial R := by
  {{LEAN_BODY}}
"""
