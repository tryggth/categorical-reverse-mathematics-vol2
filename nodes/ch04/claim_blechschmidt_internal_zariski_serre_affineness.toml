[spec]
statement = "Inside the petit Zariski topos Sh(X_Zar) of a scheme X, Blechschmidt's (2017) internal language reduces the structure sheaf O_X to a single internal local ring, precipitating Pic(X) ~= H^1(X_Zar; O_X^x) from externalizing internal triviality (Hilbert Theorem 90), while Serre's (1957) cohomological criterion diagnoses failure of global affineness X -> Spec Gamma(X, O_X) on a qcqs scheme directly through quasi-coherent ideal sheaf cohomology H^1(X; I)."
hypotheses = [
  "Blechschmidt 2017 internal topos semantics on Sh(X_Zar)",
  "Serre 1957 / EGA II cohomological affineness criterion on qcqs schemes"
]

[body]
tex = """
\\begin{inlineclaim}[Blechschmidt Internal Zariski Topos and Serre Affineness Criterion]\\label{ch04:claim:blechschmidt-internal-zariski-serre-affineness}%
\\uses{ch04:prop:zariski-radical-frame-constructive,ch04:thm:prime-spectrum-krull-choice-gate}%
Inside the petit Zariski topos $\\mathbf{Sh}(X_{\\mathrm{Zar}})$ \\cite[Chs.~3--4]{blechschmidt2017} \\cite[Ch.~V]{johnstone1982}, a scheme $X$ collapses internally to a single local ring $\\mathcal{O}_X$ without prime-spectrum Choice; externalizing internal invertibility and descent precipitates the Picard obstruction $\\mathrm{Pic}(X) \\cong H^1(X_{\\mathrm{Zar}}; \\mathcal{O}_X^{\\times})$. Dually, for a quasi-compact quasi-separated scheme $X$, Serre's criterion \\cite[Thm.~1, pp.~1--16]{serre1957_affineness} detects failure of the canonical affineness adjunction unit $X \\to \\mathrm{Spec}\\,\\Gamma(X, \\mathcal{O}_X)$ precisely through nonvanishing quasi-coherent ideal cohomology $H^1(X; \\mathcal{I}) \\neq 0$.
\\end{inlineclaim}
"""

