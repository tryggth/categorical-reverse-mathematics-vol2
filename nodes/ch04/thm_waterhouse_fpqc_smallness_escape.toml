lean_signature = """
/-- Abstract `(C, S)` Grothendieck-cover separation system modeling Waterhouse's `fpqc` escape. -/
structure UnboundedCoverSystem : Type 1 where
  Cov : Type
  rank : Cov → Nat
  Presheaf : Type
  agreeUpTo : Nat → Presheaf → Presheaf → Prop
  agreeOnCover : Cov → Presheaf → Presheaf → Prop
  agree_mono : ∀ {m n : Nat} {F G : Presheaf}, m ≤ n → agreeUpTo n F G → agreeUpTo m F G
  cover_respects_rank : ∀ (c : Cov) (F G : Presheaf),
    agreeUpTo (rank c) F G → agreeOnCover c F G
  escape_pair : ∀ k : Nat, ∃ (c : Cov) (F G : Presheaf),
    agreeUpTo k F G ∧ ¬ agreeOnCover c F G

namespace UnboundedCoverSystem

def IsSmallFamily (U : UnboundedCoverSystem) (G : U.Cov → Prop) : Prop :=
  ∃ k : Nat, ∀ c : U.Cov, G c → U.rank c ≤ k

def IsSeparatingGenerator (U : UnboundedCoverSystem) (G : U.Cov → Prop) : Prop :=
  ∀ F₁ F₂ : U.Presheaf,
    (∀ c : U.Cov, G c → U.agreeOnCover c F₁ F₂) → (∀ c : U.Cov, U.agreeOnCover c F₁ F₂)

def BoundedCutoffSeparable (U : UnboundedCoverSystem) (κ : Nat) : Prop :=
  ∃ G : U.Cov → Prop, U.IsSmallFamily G ∧
    ∀ F₁ F₂ : U.Presheaf, (∀ c : U.Cov, G c → U.agreeOnCover c F₁ F₂) → U.agreeUpTo κ F₁ F₂

end UnboundedCoverSystem

/-- Concrete `ℕ`-ranked cover system separating presheaves `ℕ → Bool` at arbitrary horizon `k`. -/
def natRankCoverSystem : UnboundedCoverSystem where
  Cov := Nat
  rank c := c + 1
  Presheaf := Nat → Bool
  agreeUpTo n F G := ∀ i : Nat, i < n → F i = G i
  agreeOnCover c F G := F c = G c
  agree_mono hmn h i hi := h i (Nat.lt_of_lt_of_le hi hmn)
  cover_respects_rank c _ _ h := h c (Nat.lt_succ_self c)
  escape_pair k :=
    ⟨k, fun _ ↦ false, fun i ↦ if i = k then true else false,
     fun i hi ↦ by have hne : i ≠ k := Nat.ne_of_lt hi; dsimp only; rw [if_neg hne],
     by show ¬ ((false : Bool) = if k = k then true else false); rw [if_pos rfl]; exact Bool.noConfusion⟩

/-- **Waterhouse `fpqc` Smallness Escape Witness (Emerald, Axiom-Free):**
    In every `UnboundedCoverSystem`, no small family can form a separating Giraud generator set,
    while `natRankCoverSystem` concretely realizes the escape and `κ`-cutoff restoration. -/
theorem waterhouse_fpqc_smallness_escape :
    (∀ (U : UnboundedCoverSystem) (G : U.Cov → Prop),
      U.IsSmallFamily G → ¬ U.IsSeparatingGenerator G) ∧
    (∀ G : natRankCoverSystem.Cov → Prop,
      natRankCoverSystem.IsSmallFamily G → ¬ natRankCoverSystem.IsSeparatingGenerator G) ∧
    (∀ κ : Nat, natRankCoverSystem.BoundedCutoffSeparable κ) := by
  {{LEAN_BODY}}
"""
guard_axiom_stanzas = [
  "/-- info: 'HomotopyCRM.Vol2.waterhouse_fpqc_smallness_escape' does not depend on any axioms -/\n#guard_msgs in\n#print axioms waterhouse_fpqc_smallness_escape"
]

[body]
lean_body = """
  have hMain : ∀ (U : UnboundedCoverSystem) (G : U.Cov → Prop),
      U.IsSmallFamily G → ¬ U.IsSeparatingGenerator G := by
    intro U G ⟨k, hk⟩ hSep
    obtain ⟨c, F₁, F₂, hAg, hNeq⟩ := U.escape_pair k
    exact hNeq (hSep F₁ F₂ (fun d hd ↦ U.cover_respects_rank d F₁ F₂ (U.agree_mono (hk d hd) hAg)) c)
  exact ⟨hMain, fun G hSmall ↦ hMain natRankCoverSystem G hSmall,
    fun κ ↦ ⟨fun (c : Nat) ↦ c < κ, ⟨κ, fun (_ : Nat) hc ↦ hc⟩, fun _ _ h ↦ h⟩⟩
"""
tex = """
\\begin{theorem}[Waterhouse's {{sym:fpqc}} Smallness Escape and Clausen--Scholze Cutoff]\\label{ch04:thm:waterhouse-fpqc-smallness-escape}%
\\uses{vol1:def:small-map-ambient,vol1:def:axis-vi-replacement,ch04:thm:replacement-iff-covariant-powerset,ch04:prop:zariski-radical-frame-constructive,ch04:prop:borger-lambda-delta-two-prime}%
Across Grothendieck's refinement chain $J_{\\mathrm{Zar}} \\subsetneq J_{\\text{\\'et}} \\subsetneq J_{\\mathrm{fppf}} \\subsetneq J_{\\mathrm{fpqc}}$ on affine schemes, the {{sym:fpqc}} topology violates Giraud's small-generating-set axiom inside {{sym:ast-pair}}~\\cite[Thms.~3.2, 5.3, pp.~601--608]{waterhouse1975}: for every small collection $G \\in \\mathcal{S}$ of affine covers, arbitrarily large faithfully flat extensions escape the rank horizon of $G$ and separate presheaves matching on $G$. Imposing an Axis~VI smallness cutoff $\\kappa$---as in Clausen--Scholze's condensed mathematics~\\cite{clausen_scholze_condensed}---restores small separation below rank $\\kappa$.
\\end{theorem}
\\begin{proof}
Recall that an {{sym:fpqc}} covering family allows arbitrary faithfully flat quasi-compact surjective morphisms $\\mathrm{Spec}(B) \\to \\mathrm{Spec}(A)$ without finiteness bounds on generator cardinality. For any candidate small generator set $G \\in \\mathcal{S}$ bounded in cardinality by a regular cardinal $\\kappa$, choose a regular cardinal $\\lambda > \\kappa$ and consider distinct presheaves built out of $\\lambda$-filtered colimits (or Waterhouse's cardinal-indexed Artin--Schreier / field-extension functors whose descent data live strictly above rank $\\kappa$ while agreeing on all extensions of size $< \\kappa$). Any functor agreeing with another on all covers in $G$ still fails to equalize their {{sym:fpqc}} sheafifications. Restricting covers to rank $< \\kappa$ recovers the exact Clausen--Scholze $\\kappa$-condensed site $\\mathbf{Cond}_\\kappa$. Theorem~\\texttt{waterhouse\\_fpqc\\_smallness\\_escape} in \\texttt{SchemeResiduum.lean} verifies the abstract $(\\mathcal{C}, \\mathcal{S})$ rank-escape obstruction and $\\kappa$-cutoff restoration on \\texttt{natRankCoverSystem} axiom-free.
\\end{proof}
"""

