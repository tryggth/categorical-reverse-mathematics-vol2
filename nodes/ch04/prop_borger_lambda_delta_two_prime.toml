/-- Axiom-free commutative-ring record for two-prime Borger `Λ`-descent without `propext`. -/
structure PureCRing (R : Type u) where
  zero : R
  one : R
  add : R → R → R
  neg : R → R
  mul : R → R → R
  add_assoc : ∀ a b c, add (add a b) c = add a (add b c)
  add_comm : ∀ a b, add a b = add b a
  zero_add : ∀ a, add zero a = a
  neg_add : ∀ a, add (neg a) a = zero
  mul_assoc : ∀ a b c, mul (mul a b) c = mul a (mul b c)
  mul_comm : ∀ a b, mul a b = mul b a
  one_mul : ∀ a, mul one a = a
  mul_add : ∀ a b c, mul a (add b c) = add (mul a b) (mul a c)
namespace PureCRing
def addZero {R : Type u} (C : PureCRing R) (a : R) : C.add a C.zero = a := by rw [C.add_comm, C.zero_add]
def addMul {R : Type u} (C : PureCRing R) (a b c : R) : C.mul (C.add a b) c = C.add (C.mul a c) (C.mul b c) := by
  rw [C.mul_comm, C.mul_add, C.mul_comm c a, C.mul_comm c b]
def mulZero {R : Type u} (C : PureCRing R) (a : R) : C.mul a C.zero = C.zero := by
  have h := congrArg (C.add (C.neg (C.mul a C.zero))) (by rw [← C.mul_add, C.zero_add] : C.add (C.mul a C.zero) (C.mul a C.zero) = C.mul a C.zero)
  rw [← C.add_assoc, C.neg_add, C.zero_add] at h; exact h
def zeroMul {R : Type u} (C : PureCRing R) (a : R) : C.mul C.zero a = C.zero := by rw [C.mul_comm, C.mulZero]
def sq {R : Type u} (C : PureCRing R) (x : R) : R := C.mul x x
def cube {R : Type u} (C : PureCRing R) (x : R) : R := C.mul (C.mul x x) x
def dbl {R : Type u} (C : PureCRing R) (x : R) : R := C.add x x
def tpl {R : Type u} (C : PureCRing R) (x : R) : R := C.add (C.add x x) x
def add4 {R : Type u} (C : PureCRing R) (u v w t : R) : C.add (C.add u v) (C.add w t) = C.add (C.add u w) (C.add v t) := by
  rw [C.add_assoc, ← C.add_assoc v w t, C.add_comm v w, C.add_assoc w v t, ← C.add_assoc]
def tplAdd {R : Type u} (C : PureCRing R) (u v : R) : C.tpl (C.add u v) = C.add (C.tpl u) (C.tpl v) := by
  dsimp only [PureCRing.tpl]; rw [C.add4 u v u v, C.add4]
end PureCRing
/-- Constructive ring endomorphism on a `PureCRing`. -/
structure PureRingEnd {R : Type u} (C : PureCRing R) where
  toFun : R → R
  map_zero : toFun C.zero = C.zero
  map_one : toFun C.one = C.one
  map_add : ∀ x y, toFun (C.add x y) = C.add (toFun x) (toFun y)
  map_mul : ∀ x y, toFun (C.mul x y) = C.mul (toFun x) (toFun y)
def PureRingEnd.id {R : Type u} (C : PureCRing R) : PureRingEnd C :=
  ⟨fun x ↦ x, rfl, rfl, fun _ _ ↦ rfl, fun _ _ ↦ rfl⟩
def PureRingEnd.comp {R : Type u} {C : PureCRing R} (f g : PureRingEnd C) : PureRingEnd C :=
  ⟨fun x ↦ f.toFun (g.toFun x), by dsimp only; rw [g.map_zero, f.map_zero], by dsimp only; rw [g.map_one, f.map_one],
   fun x y ↦ by dsimp only; rw [g.map_add, f.map_add], fun x y ↦ by dsimp only; rw [g.map_mul, f.map_mul]⟩
/-- Two-prime Borger `Λ`-datum (`p = 2, 3`): commuting endomorphisms lifting Frobenius powers. -/
structure FrobLift23 {R : Type u} (C : PureCRing R) where
  psi2 : PureRingEnd C
  psi3 : PureRingEnd C
  lift2 : ∀ x : R, ∃ d : R, psi2.toFun x = C.add (C.sq x) (C.dbl d)
  lift3 : ∀ x : R, ∃ d : R, psi3.toFun x = C.add (C.cube x) (C.tpl d)
  comm : psi2.comp psi3 = psi3.comp psi2
def delta2Nat : Nat → Nat | 0 => 0 | k + 1 => delta2Nat k + k
def delta3Nat : Nat → Nat | 0 => 0 | k + 1 => delta3Nat k + k * k + k
private lemma nat_add_mul' (a b c : Nat) : (a + b) * c = a * c + b * c := by
  rw [Nat.mul_comm, Nat.mul_add, Nat.mul_comm c a, Nat.mul_comm c b]
private lemma nat_add_rc (a b c : Nat) : a + b + c = a + c + b := by rw [Nat.add_assoc, Nat.add_comm b c, ← Nat.add_assoc]
theorem delta2Nat_spec (n : Nat) : n * n = n + 2 * delta2Nat n := by
  induction n with
  | zero => rfl
  | succ k ih =>
    change (k + 1) * (k + 1) = (k + 1) + 2 * (delta2Nat k + k)
    have h2k : 2 * k = k + k := by change (1 + 1) * k = k + k; rw [nat_add_mul', Nat.one_mul]
    rw [nat_add_mul', Nat.mul_add, Nat.mul_one, Nat.one_mul, ih, Nat.mul_add, h2k, ← Nat.add_assoc (k + 2 * delta2Nat k + k),
        ← Nat.add_assoc (k + 1), ← Nat.add_assoc (k + 1 + 2 * delta2Nat k), nat_add_rc k 1 (2 * delta2Nat k),
        nat_add_rc (k + 2 * delta2Nat k) 1 k, nat_add_rc (k + 2 * delta2Nat k + k) 1 k]
theorem delta3Nat_spec (n : Nat) : n * n * n = n + 3 * delta3Nat n := by
  induction n with
  | zero => rfl
  | succ k ih =>
    change (k + 1) * (k + 1) * (k + 1) = (k + 1) + 3 * (delta3Nat k + k * k + k)
    have h3 : ∀ x : Nat, 3 * x = x + x + x := fun x ↦ by change (1 + 1 + 1) * x = x + x + x; rw [nat_add_mul', nat_add_mul', Nat.one_mul]
    have hsq : (k + 1) * (k + 1) = k * k + k + k + 1 := by rw [nat_add_mul', Nat.mul_add, Nat.mul_one, Nat.one_mul, ← Nat.add_assoc]
    rw [hsq, Nat.mul_add, Nat.mul_one, nat_add_mul', nat_add_mul', nat_add_mul', Nat.one_mul, ih, Nat.mul_add, Nat.mul_add, h3 (k * k), h3 k,
        ← Nat.add_assoc (k + 3 * delta3Nat k + k * k + k * k + k), ← Nat.add_assoc (k + 3 * delta3Nat k + k * k + k * k + k),
        ← Nat.add_assoc (k + 3 * delta3Nat k + k * k + k * k + k), nat_add_rc (k + 3 * delta3Nat k + k * k + k * k) k (k * k),
        ← Nat.add_assoc (k + 1), ← Nat.add_assoc (k + 1), ← Nat.add_assoc (k + 1 + 3 * delta3Nat k), ← Nat.add_assoc (k + 1 + 3 * delta3Nat k),
        ← Nat.add_assoc (k + 1 + 3 * delta3Nat k + k * k + k * k + k * k), ← Nat.add_assoc (k + 1 + 3 * delta3Nat k + k * k + k * k + k * k),
        nat_add_rc k 1 (3 * delta3Nat k), nat_add_rc (k + 3 * delta3Nat k) 1 (k * k), nat_add_rc (k + 3 * delta3Nat k + k * k) 1 (k * k),
        nat_add_rc (k + 3 * delta3Nat k + k * k + k * k) 1 (k * k), nat_add_rc (k + 3 * delta3Nat k + k * k + k * k + k * k) 1 k,
        nat_add_rc (k + 3 * delta3Nat k + k * k + k * k + k * k + k) 1 k, nat_add_rc (k + 3 * delta3Nat k + k * k + k * k + k * k + k + k) 1 k]
def zmod12CRing : PureCRing (Fin 12) :=
  ⟨⟨0, by decide⟩, ⟨1, by decide⟩, fun a b ↦ ⟨(a.1 + b.1) % 12, Nat.mod_lt _ (by decide)⟩,
   fun a ↦ ⟨(12 - a.1 % 12) % 12, Nat.mod_lt _ (by decide)⟩, fun a b ↦ ⟨(a.1 * b.1) % 12, Nat.mod_lt _ (by decide)⟩,
   by decide, by decide, by decide, by decide, by decide, by decide, by decide, by decide⟩
def zmod12FrobLift23 : FrobLift23 zmod12CRing :=
  ⟨PureRingEnd.id zmod12CRing, PureRingEnd.id zmod12CRing,
   fun x ↦ ⟨⟨(12 - delta2Nat x.1 % 12) % 12, Nat.mod_lt _ (by decide)⟩, by revert x; decide⟩,
   fun x ↦ ⟨⟨(12 - delta3Nat x.1 % 12) % 12, Nat.mod_lt _ (by decide)⟩, by revert x; decide⟩, rfl⟩
/-- Square-zero extension `R[ε₂, ε₃] / (ε₂, ε₃)²`. -/
structure DualPair (R : Type u) where
  a : R
  b : R
  c : R
private lemma dualPair_eq {R : Type u} {x y : DualPair R} (ha : x.a = y.a) (hb : x.b = y.b) (hc : x.c = y.c) : x = y := by
  cases x; cases y; subst ha; subst hb; subst hc; rfl
def dualPairCRing {R : Type u} (C : PureCRing R) : PureCRing (DualPair R) :=
  ⟨⟨C.zero, C.zero, C.zero⟩, ⟨C.one, C.zero, C.zero⟩,
   fun x y ↦ ⟨C.add x.a y.a, C.add x.b y.b, C.add x.c y.c⟩, fun x ↦ ⟨C.neg x.a, C.neg x.b, C.neg x.c⟩,
   fun x y ↦ ⟨C.mul x.a y.a, C.add (C.mul x.a y.b) (C.mul x.b y.a), C.add (C.mul x.a y.c) (C.mul x.c y.a)⟩,
   fun _ _ _ ↦ dualPair_eq (C.add_assoc _ _ _) (C.add_assoc _ _ _) (C.add_assoc _ _ _),
   fun _ _ ↦ dualPair_eq (C.add_comm _ _) (C.add_comm _ _) (C.add_comm _ _),
   fun _ ↦ dualPair_eq (C.zero_add _) (C.zero_add _) (C.zero_add _),
   fun _ ↦ dualPair_eq (C.neg_add _) (C.neg_add _) (C.neg_add _),
   fun x y z ↦ dualPair_eq (C.mul_assoc _ _ _) (by dsimp only; rw [C.mul_add, C.addMul, C.mul_assoc, C.mul_assoc, C.mul_assoc, C.add_assoc])
     (by dsimp only; rw [C.mul_add, C.addMul, C.mul_assoc, C.mul_assoc, C.mul_assoc, C.add_assoc]),
   fun x y ↦ dualPair_eq (C.mul_comm _ _) (by dsimp only; rw [C.mul_comm x.a y.b, C.mul_comm x.b y.a, C.add_comm])
     (by dsimp only; rw [C.mul_comm x.a y.c, C.mul_comm x.c y.a, C.add_comm]),
   fun _ ↦ dualPair_eq (C.one_mul _) (by dsimp only; rw [C.one_mul, C.zeroMul, C.addZero]) (by dsimp only; rw [C.one_mul, C.zeroMul, C.addZero]),
   fun _ _ _ ↦ dualPair_eq (C.mul_add _ _ _) (by dsimp only; rw [C.mul_add, C.mul_add, C.add4]) (by dsimp only; rw [C.mul_add, C.mul_add, C.add4])⟩
def dualPsi2 {R : Type u} (C : PureCRing R) : PureRingEnd (dualPairCRing C) :=
  ⟨fun x ↦ ⟨x.a, C.dbl x.b, C.zero⟩, dualPair_eq rfl (C.zero_add C.zero) rfl, dualPair_eq rfl (C.zero_add C.zero) rfl,
   fun x y ↦ dualPair_eq rfl (by dsimp only [dualPairCRing, PureCRing.dbl]; exact C.add4 _ _ _ _) (C.zero_add C.zero).symm,
   fun x y ↦ dualPair_eq rfl (by dsimp only [dualPairCRing, PureCRing.dbl]; rw [C.mul_add, C.addMul, C.add4])
     (by dsimp only [dualPairCRing]; rw [C.mulZero, C.zeroMul, C.zero_add])⟩
def dualPsi3 {R : Type u} (C : PureCRing R) : PureRingEnd (dualPairCRing C) :=
  ⟨fun x ↦ ⟨x.a, C.tpl x.c, C.zero⟩, dualPair_eq rfl (by dsimp only [dualPairCRing, PureCRing.tpl]; rw [C.zero_add, C.zero_add]) rfl,
   dualPair_eq rfl (by dsimp only [dualPairCRing, PureCRing.tpl]; rw [C.zero_add, C.zero_add]) rfl,
   fun x y ↦ dualPair_eq rfl (by dsimp only [dualPairCRing]; exact C.tplAdd _ _) (C.zero_add C.zero).symm,
   fun x y ↦ dualPair_eq rfl (by dsimp only [dualPairCRing]; rw [C.tplAdd]; dsimp only [PureCRing.tpl]; rw [C.mul_add, C.mul_add, C.addMul, C.addMul])
     (by dsimp only [dualPairCRing]; rw [C.mulZero, C.zeroMul, C.zero_add])⟩
/-- **Borger Two-Prime `Λ`-Compatibility Separation (Emerald, Axiom-Free):**
    `ℕ` & `ℤ/12ℤ` satisfy commuting `δ₂, δ₃` lifts, while `(dualPsi2, dualPsi3)` satisfy individual
    mod-2 / mod-3 Frobenius lifts yet fail `ψ₂ ∘ ψ₃ = ψ₃ ∘ ψ₂`. -/
theorem borger_lambda_delta_two_prime :
    (∀ n : Nat, n * n = n + 2 * delta2Nat n ∧ n * n * n = n + 3 * delta3Nat n) ∧
    (zmod12FrobLift23.psi2.comp zmod12FrobLift23.psi3 = zmod12FrobLift23.psi3.comp zmod12FrobLift23.psi2) ∧
    (∀ x : DualPair (Fin 12), ∃ d : DualPair (Fin 12),
      (dualPsi2 zmod12CRing).toFun x = (dualPairCRing zmod12CRing).add ((dualPairCRing zmod12CRing).sq x) ((dualPairCRing zmod12CRing).dbl d)) ∧
    (∀ x : DualPair (Fin 12), ∃ d : DualPair (Fin 12),
      (dualPsi3 zmod12CRing).toFun x = (dualPairCRing zmod12CRing).add ((dualPairCRing zmod12CRing).cube x) ((dualPairCRing zmod12CRing).tpl d)) ∧
    ¬ ((dualPsi2 zmod12CRing).comp (dualPsi3 zmod12CRing) = (dualPsi3 zmod12CRing).comp (dualPsi2 zmod12CRing)) := by
  {{LEAN_BODY}}
"""
