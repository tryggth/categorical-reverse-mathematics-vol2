tex = """
\\begin{proposition}[Borger Two-Prime $\\Lambda/\\delta$-Compatibility Obstruction]\\label{ch04:prop:borger-lambda-delta-two-prime}%
\\uses{ch04:prop:zariski-radical-frame-constructive}%
In Borger's $\\mathbb{F}_1$-descent architecture~\\cite[pp.~231--285]{borger2011}, a $\\Lambda$-ring structure requires commuting Frobenius lifts $\\psi_p$ across primes ($p = 2, 3$ already witnessing non-trivial multi-prime locking). In \\texttt{SchemeResiduum.lean} (constructive \\textbf{Emerald} stratum, zero axioms):
\\begin{enumerate}[label=\\textup{(\\arabic*)},leftmargin=2.0em]
  \\item $\\mathbb{N}$ satisfies exact Fermat-quotient identities $n^2 = n + 2\\delta_2(n)$ and $n^3 = n + 3\\delta_3(n)$, equipping $\\mathbb{Z}/12\\mathbb{Z}$ with a canonical commuting $\\Lambda$-pair \\texttt{zmod12FrobLift23} over \\texttt{PureCRing}.
  \\item Over the square-zero extension $(\\mathbb{Z}/12\\mathbb{Z})[\\varepsilon_2,\\varepsilon_3]/(\\varepsilon_2,\\varepsilon_3)^2$, the endomorphisms $\\psi_2(a + b\\varepsilon_2 + c\\varepsilon_3) = a + 2b\\varepsilon_2$ and $\\psi_3(a + b\\varepsilon_2 + c\\varepsilon_3) = a + 3c\\varepsilon_2$ satisfy their separate $p = 2$ and $p = 3$ congruence lift equations while breaking commutativity ($\\psi_2(\\psi_3(\\varepsilon_3)) = 6\\varepsilon_2 \\neq 0 = \\psi_3(\\psi_2(\\varepsilon_3))$).
\\end{enumerate}
\\end{proposition}
\\begin{proof}
Inductive Fermat quotients \\texttt{delta2Nat} and \\texttt{delta3Nat} certify the polynomial congruences purely in Martin-L\\\"of $\\mathbb{N}$-arithmetic without \\texttt{propext}; on \\texttt{DualPair (Fin 12)} built inside the axiom-free \\texttt{PureCRing} interface, finite exhaustive checking certifies both individual congruence lifts while evaluation at $(0, 0, 1)$ separates $\\psi_2 \\circ \\psi_3$ from $\\psi_3 \\circ \\psi_2$ with zero axioms.
\\end{proof}
"""

