[spec]
statement = "The classical schism between Aristotle's / Weyl's (1918) cohesive non-pointwise continuum and Cantor-Dedekind's point-set continuum 2^N is reconciled categorically by Lawvere's (2007) cohesive quadruple Pi -| Disc -| Gamma -| Codisc on topological/simplicial spaces: Γ sends both a connected interval I and its discretized point set Disc(|I|) to isomorphic point-sets Γ(I) ~= Γ(Disc(|I|)), while connected components Pi(I) ~ 1 strictly separate connected cohesion from discrete point-dust Pi(Disc(|I|)). In PointillistContinua.lean, ReflGraph mechanizes Disc -| Gamma -| Codisc and the I_1 vs. Disc(Bool) separation with 0 axioms."
hypotheses = [
  "Lawvere 2007 axiomatic cohesion Pi -| Disc -| Gamma -| Codisc",
  "Weyl 1918 Das Kontinuum critique of point-set reducibility"
]

