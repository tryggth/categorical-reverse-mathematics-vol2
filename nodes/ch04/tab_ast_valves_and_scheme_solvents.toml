\\midrule
Axis~VI Image Descent & {{sym:ast-pair}} + Union & Emerald & Covariant {{sym:ps-func}} $\\iff$ Family Union~\\cite{joyal_moerdijk1995} & {{ref:ch04:thm:replacement-iff-covariant-powerset}} \\\\
Guardrail~5 Escape & $(V_{\\omega+\\omega}, \\mathrm{Def})$ & Emerald & $\\bigcup_n \\mathcal{P}^n(\\mathbb{N}) \\subsetneq \\bigcup_n \\mathcal{P}^n(V_\\omega)$ ($V_\\omega$ witness) & {{ref:ch04:prop:iterated-powerset-escape-guardrail}} \\\\
Pointillist $H(\\aleph_1)$ & {{sym:zfc-minus}} & Emerald & Reals $\\in \\mathcal{S}$ while $2^{\\mathbb{N}} \\notin \\mathcal{S}$ (Cantor diag.) & {{ref:ch04:thm:pointillist-continuum-and-czf-split}} \\\\
{{sym:czf}} Power Residuum & Heyting $\\Omega = \\mathrm{Fin}\\,3$ & Emerald / Ext. & $2^X \\in \\mathcal{S}$ ($\\mathsf{KP}\\omega$ cons.) vs.\\ $\\Omega^X$ past $\\mathsf{Z}_2$~\\cite{aczel1978} & {{ref:ch04:thm:pointillist-continuum-and-czf-split}}, {{ref:ch04:claim:aczel-czf-kp-conservativity}} \\\\
Cohesive Continuum & $\\Pi \\dashv \\mathrm{Disc} \\dashv \\Gamma \\dashv \\mathrm{Codisc}$ & Emerald & Same $\\Gamma$, distinct connectedness $I_1$ vs.\\ $\\mathrm{Disc}(2)$~\\cite{lawvere2007} & {{ref:ch04:prop:cohesive-aristotle-cantor-adjudication}} \\\\
Ultrafilter Corona & $\\mathbb{N}^* = \\beta\\mathbb{N}\\setminus\\mathbb{N}$ & External & Puritz skies ($1$ sky iff $P$-point) vs.\\ Shelah / $\\mathsf{NCF}$ & {{ref:ch04:claim:puritz-shelah-ultrafilter-sky-spectrum}} \\\\
Zariski Locale {{sym:zar-loc}} & Commutative $R$ & Emerald & Radical nucleus $\\sqrt{P}$, $1 \\in \\sqrt{P} \\iff 1 \\in P$ (choice-free)~\\cite{johnstone1982} & {{ref:ch04:prop:zariski-radical-frame-constructive}} \\\\
Krull Prime Spectrum & $\\mathrm{Spec}(R)$ points & Crimson & $\\mathrm{Nonempty}(\\mathrm{Spec}\\,R) \\iff \\mathrm{Nontrivial}\\,R$ crosses Choice gate & {{ref:ch04:thm:prime-spectrum-krull-choice-gate}} \\\\
Internal Zariski / Serre & $\\mathbf{Sh}(X_{\\mathrm{Zar}})$ & External & $\\mathrm{Pic}(X) \\cong H^1(\\mathcal{O}_X^\\times)$; qcqs $H^1(X;\\mathcal{I})$~\\cite{blechschmidt2017} & {{ref:ch04:claim:blechschmidt-internal-zariski-serre-affineness}} \\\\
Borger $\\Lambda$-Lifts & $\\mathbb{N}, \\mathbb{Z}/12\\mathbb{Z}$ vs.\\ $(\\mathbb{Z}/12\\mathbb{Z})[\\varepsilon_2,\\varepsilon_3]/\\mathfrak{m}^2$ & Emerald & Fermat $\\delta_2,\\delta_3$ on $\\mathbb{N}, \\mathbb{Z}/12\\mathbb{Z}$; $\\psi_2\\psi_3 \\neq \\psi_3\\psi_2$ on dual ring~\\cite{borger2011} & {{ref:ch04:prop:borger-lambda-delta-two-prime}} \\\\
{{sym:fpqc}} Smallness Cutoff & Affine $J_{\\mathrm{Zar}} \\subsetneq J_{\\mathrm{fpqc}}$ & Emerald & Unbounded cover escape vs.\\ $\\kappa$-cutoff restoration~\\cite{waterhouse1975} & {{ref:ch04:thm:waterhouse-fpqc-smallness-escape}} \\\\
\\bottomrule
\\end{tabularx}
\\caption{Chapter~4 synthesis across Stratum~II Algebraic Set Theory size-compression valves, pointillist continua, and Grothendieck scheme solvents.}
