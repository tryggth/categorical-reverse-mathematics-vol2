[spec]
statement = "On the Stone-Cech corona N* = beta N \\ N, Puritz (1971) classifies the Archimedean galaxies (skies) of nonstandard arithmetic *N_U via Rudin-Keisler / conservative projections of ultrafilter U (giving a single sky iff U is a P-point). Combined with Shelah's (1982) ZFC consistency without P-points and Blass's (1986) Near Coherence of Filters (NCF) forcing model where all free ultrafilters have coalescent finite-to-one images, the Ultrafilter Sky Spectrum stratifies Cantor's corona into independent ZFC worlds."
hypotheses = [
  "Puritz 1971 sky ordering over nonstandard *N_U",
  "Shelah 1982 Proper Forcing Ch. VI and Blass 1986 NCF models"
]

[body]
tex = """
\\begin{inlineclaim}[Touchstone Spectrum: Puritz Skies, Shelah $P$-Points, and Blass $\\mathsf{NCF}$]\\label{ch04:claim:puritz-shelah-ultrafilter-sky-spectrum}%
\\uses{ch04:prop:cohesive-aristotle-cantor-adjudication}%
On the compact zero-isolated-point corona $\\mathbb{N}^* = \\beta\\mathbb{N} \\setminus \\mathbb{N}$, Puritz's~\\cite[pp.~705--733]{puritz1971} constellation--sky ordering proves that an ultrapower ${}^*\\mathbb{N}_{\\mathcal{U}}$ possesses a single non-trivial sky iff $\\mathcal{U}$ is a $P$-point. Across $\\mathsf{ZFC}$ extensions, this spectrum bifurcates strictly between $\\mathsf{CH}/\\mathsf{MA}$ (abundant $P$-points), Shelah's model with zero $P$-points~\\cite[Ch.~VI, pp.~181--203]{shelah1982_ppoints}, and Blass's Near Coherence of Filters ($\\mathsf{NCF}$)~\\cite[pp.~579--591]{blass1986_ncf}, under which all non-principal ultrafilters collapse modulo finite-to-one maps to a single minimal sky.
\\end{inlineclaim}
"""

