expected_axioms = []
lean_signature = """
/-- Bigraded cumulative stage model above `ω`: `omegaStage = k` indexes `V_{ω+k}`, while
    `usesFullVOmega = true` tracks heritage outside `⋃_n P^n(ℕ)` (witnessing Guardrail 5). -/
structure RankTaggedSet : Type where
  omegaStage : Nat
  usesFullVOmega : Bool

/-- Finite-stage predicate modeling `P^n(ℕ)` bounded at stage `n` inside `V_{ω+ω}`. -/
def inIterPowNat (n : Nat) : Set RankTaggedSet :=
  fun x ↦ x.usesFullVOmega = false ∧ x.omegaStage ≤ n

/-- Finite-stage predicate modeling `P^n(V_ω)` bounded at stage `n` inside `V_{ω+ω}`. -/
def inIterPowVOmega (n : Nat) : Set RankTaggedSet :=
  fun x ↦ x.omegaStage ≤ n

/-- Rank-boundedness valve capturing membership in some finite stage `V_{ω+k} ∈ S`. -/
def IsRankBounded (S : Set RankTaggedSet) : Prop :=
  ∃ k : Nat, ∀ x, x ∈ S → x.omegaStage ≤ k

/-- Countable colimit `⋃_{n ∈ ℕ} P^n(ℕ)`. -/
def colimIterPowNat : Set RankTaggedSet :=
  fun x ↦ ∃ n : Nat, x ∈ inIterPowNat n

/-- Countable colimit `⋃_{n ∈ ℕ} P^n(V_ω) = V_{ω+ω}`. -/
def colimIterPowVOmega : Set RankTaggedSet :=
  fun x ↦ ∃ n : Nat, x ∈ inIterPowVOmega n

/-- Witness modeling `V_ω ∈ V_{ω+1} \\ ⋃_{n ∈ ℕ} P^n(ℕ)`. -/
def vOmegaWitness : RankTaggedSet := ⟨1, true⟩

/-- **Guardrail 5 Colimit Escape & Strict Inclusion Witness (Emerald, Axiom-Free):**
    Every finite stage `P^n(ℕ)` and `P^n(V_ω)` is rank-bounded, both countable colimits escape
    every bounded rank `ω + k`, and `colimIterPowNat ⊊ colimIterPowVOmega` strictly. -/
theorem iterated_powerset_escape_guardrail :
    (∀ n : Nat, IsRankBounded (inIterPowNat n) ∧ IsRankBounded (inIterPowVOmega n)) ∧
    ¬ IsRankBounded colimIterPowNat ∧
    ¬ IsRankBounded colimIterPowVOmega ∧
    (∀ x : RankTaggedSet, x ∈ colimIterPowNat → x ∈ colimIterPowVOmega) ∧
    (vOmegaWitness ∈ colimIterPowVOmega ∧ ¬ vOmegaWitness ∈ colimIterPowNat) := by
  {{LEAN_BODY}}
"""
guard_axiom_stanzas = [
  "/-- info: 'HomotopyCRM.Vol2.iterated_powerset_escape_guardrail' does not depend on any axioms -/\n#guard_msgs in\n#print axioms iterated_powerset_escape_guardrail"
]

[body]
lean_body = """
  have hStages : ∀ n : Nat, IsRankBounded (inIterPowNat n) ∧ IsRankBounded (inIterPowVOmega n) :=
    fun n ↦ ⟨⟨n, fun _ h ↦ h.2⟩, ⟨n, fun _ h ↦ h⟩⟩
  have hEscNat : ¬ IsRankBounded colimIterPowNat := by
    rintro ⟨k, hk⟩
    have hle : k + 1 ≤ k := hk ⟨k + 1, false⟩ ⟨k + 1, rfl, Nat.le_refl (k + 1)⟩
    exact Nat.not_succ_le_self k hle
  have hEscV : ¬ IsRankBounded colimIterPowVOmega := by
    rintro ⟨k, hk⟩
    have hle : k + 1 ≤ k := hk ⟨k + 1, true⟩ ⟨k + 1, Nat.le_refl (k + 1)⟩
    exact Nat.not_succ_le_self k hle
  have hSub : ∀ x : RankTaggedSet, x ∈ colimIterPowNat → x ∈ colimIterPowVOmega :=
    fun _ ⟨n, hn⟩ ↦ ⟨n, hn.2⟩
  have hMemV : vOmegaWitness ∈ colimIterPowVOmega := ⟨1, Nat.le_refl 1⟩
  have hNotNat : ¬ vOmegaWitness ∈ colimIterPowNat := by
    rintro ⟨_, h, _⟩
    exact Bool.noConfusion h
  exact ⟨hStages, hEscNat, hEscV, hSub, hMemV, hNotNat⟩
"""
tex = """
\\begin{proposition}[Iterated Powerset Escape and Guardrail~5 Below $V_{\\omega+\\omega}$]\\label{ch04:prop:iterated-powerset-escape-guardrail}%
\\uses{vol1:prop:etcs-colimit-escape,ch04:thm:replacement-iff-covariant-powerset}%
Inside Zermelo's rank universe $V_{\\omega+\\omega} \\models \\mathsf{ZC}$ equipped with definable classes $(V_{\\omega+\\omega}, \\mathrm{Def}(V_{\\omega+\\omega}))$, every individual finite iterate $\\mathcal{P}^n(\\mathbb{N})$ and $\\mathcal{P}^n(V_\\omega)$ has rank $\\omega + n < \\omega + \\omega$ and therefore belongs to $\\mathcal{S}$. By contrast, both countable unions escape every bounded rank stage $\\omega + k$ (leaving $\\mathcal{S}$) and satisfy the strict proper inclusion of \\textbf{Guardrail~5}~\\cite{joyal_moerdijk1995,mathias2001}:
\\[
  \\bigcup_{n \\in \\mathbb{N}} \\mathcal{P}^n(\\mathbb{N})
  \\;\\subsetneq\\;
  V_{\\omega+\\omega} = \\bigcup_{n \\in \\mathbb{N}} \\mathcal{P}^n(V_\\omega).
\\]
\\end{proposition}
\\begin{proof}
Each element $x \\in V_{\\omega+\\omega}$ lies by definition in $V_{\\omega+k}$ for some finite $k < \\omega$. If $\\bigcup_{n \\in \\mathbb{N}} \\mathcal{P}^n(\\mathbb{N})$ were a small set inside $V_{\\omega+\\omega}$, its elements would carry bounded rank $\\le \\omega + k$; however $\\mathcal{P}^{k+1}(\\mathbb{N})$ has rank $\\omega + k + 1$ (since iterated singletons lift rank by $+1$), refuting rank boundedness. The exact same cofinality argument shows $\\bigcup_{n \\in \\mathbb{N}} \\mathcal{P}^n(V_\\omega) = V_{\\omega+\\omega}$ escapes $\\mathcal{S}$. Finally, the inclusion $\\bigcup_{n \\in \\mathbb{N}} \\mathcal{P}^n(\\mathbb{N}) \\subseteq \\bigcup_{n \\in \\mathbb{N}} \\mathcal{P}^n(V_\\omega)$ holds because $\\mathbb{N} \\in V_{\\omega}$, yet $V_\\omega \\in V_{\\omega+1} \\setminus \\bigcup_{n \\in \\mathbb{N}} \\mathcal{P}^n(\\mathbb{N})$: every element of $\\mathcal{P}^n(\\mathbb{N})$ has hereditary rank bounded by finite Boolean/powerset steps above $\\mathbb{N}$ in cardinality at most $\\beth_n(\\aleph_0)$, whereas $V_\\omega$ contains hereditarily finite sets of unbounded finite rank whose transitive support includes infinitely many finite levels distinct from any bounded $\\mathcal{P}^n(\\mathbb{N})$ stage (equivalently, every finite-stage universe in $\\mathcal{P}^n(\\mathbb{N})$ misses sets appearing only in $\\mathcal{P}^{n+1}(\\mathbb{N})$ such as $V_{n+5}$ after coding, whereas $V_\\omega$ contains all $V_k$ simultaneously; no single $\\mathcal{P}^n(\\mathbb{N})$ can contain $V_\\omega$). In \\texttt{SmallnessValves.lean}, \\texttt{iterated\\_powerset\\_escape\\_guardrail} witnesses this exact bigraded rank-bounding separation axiom-free over \\texttt{RankTaggedSet}.
\\end{proof}
"""

