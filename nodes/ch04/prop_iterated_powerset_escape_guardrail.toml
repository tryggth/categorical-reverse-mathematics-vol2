[spec]
statement = "Over ZC modeled in V_{omega+omega} (with definable classes (V_{omega+omega}, Def(V_{omega+omega}))), each finite iterate P^n(N) and P^n(V_omega) lies in S at rank omega + n, yet both countable unions colim_n P^n(N) and colim_n P^n(V_omega) escape every bounded rank omega + k (failing S-smallness), with strict inclusion U_n P^n(N) subsetneq V_{omega+omega} = U_n P^n(V_omega) witnessed by V_omega (Guardrail 5). In SmallnessValves.lean, the bigraded rank-width model RankTaggedSet certifies both escapes and the strict proper witness axiom-free."
hypotheses = [
  "Guardrail 5 (cumulative_hierarchy_strict_inclusion)",
  "V_{omega+omega} |= ZC without Replacement"
]

