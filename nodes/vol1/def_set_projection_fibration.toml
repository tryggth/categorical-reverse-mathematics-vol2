\\begin{definition}[Volume~I Grounding Contract: Class--Set Model Spaces and $\\mathrm{Def} \\dashv \\pi_{\\mathrm{Set}}$]\\label{vol1:def:set-projection-fibration}%
Pinned read-only to Volume~I (\\texttt{def:set-projection-fibration}, \\texttt{docs/ch07\\_sets\\_residuum.tex:18}, Lean witnesses \\texttt{HomotopyCRM.SetsResiduum.defSetProjAdjunction} and \\texttt{naive\\_pullback\\_breaks\\_subclass\\_separation}, Zenodo DOI \\texttt{10.5281/zenodo.24238086})~\\cite{godel1940,joyal_moerdijk1995}. Let $\\mathsf{GB}_0$ denote Replacement-free Bernays--G\\\"odel class theory over Zermelo set theory $\\mathsf{Z}$ closed under G\\\"odel operations \\textbf{G1--G8} and Subclass Separation ($C \\subseteq A \\in \\mathcal{S} \\implies C \\in \\mathcal{S}$), with $\\mathsf{GB} := \\mathsf{GB}_0 + \\mathrm{Rep}$, $\\mathsf{GBC} := \\mathsf{GB} + \\mathrm{AC}$, and $\\mathsf{NBG} := \\mathsf{GBC} + \\mathrm{GC}$. The forgetful functor $\\pi_{\\mathrm{Set}} : \\mathbf{Mod}(\\mathsf{GB}_0) \\twoheadrightarrow \\mathbf{Mod}(\\mathsf{Z})$ fails to be a Grothendieck fibration under naive trace pullback $f^*\\mathcal{D} := \\{f^{-1}[D] \\mid D \\in \\mathcal{D}\\}$, whereas minimal parameter-definable expansion furnishes a full coreflective embedding $\\mathrm{Def} \\dashv \\pi_{\\mathrm{Set}}$.
\\end{definition}
"""

