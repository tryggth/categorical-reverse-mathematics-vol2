\\begin{theorem}[Volume~I Grounding Contract: Glazer's $\\mathcal{L}_\\in$-Non-Conservativity of $\\mathsf{GC}$ Over $\\mathsf{ZC}$]\\label{vol1:thm:glazer-nonconservativity}%
Pinned read-only to Volume~I (\\texttt{thm:glazer-nonconservativity}, \\texttt{docs/ch07\\_sets\\_residuum.tex:116}, Zenodo DOI \\texttt{10.5281/zenodo.24238086})~\\cite{glazer2023,mathias2001}. Scoped strictly to full-Separation $\\mathsf{ZC}$ versus $\\mathsf{GBC}_0 + \\mathsf{GC}$ (distinct from $\\mathsf{GB}_0$ over $\\Delta_0$-bounded $\\mathsf{Mac}$~\\cite{mathias2001}), Glazer's explicit first-order sentence $\\theta_{\\mathrm{Glz}} := (\\mathsf{CH} \\wedge \\psi_{\\mathrm{fnd}})$ is consistent with $\\mathsf{ZC}$ yet refuted by $\\mathsf{GBC}_0 + \\mathsf{GC} \\vdash \\neg\\theta_{\\mathrm{Glz}}$ via a small-domain partial surjection $\\mathcal{P}(\\omega \\times \\omega) \\rightharpoonup W_2$ onto the prewellordering $W_2 \\in \\mathcal{P}^5(\\omega)$ of order type $\\omega_2$.
\\end{theorem}
"""

