tex = """
\\begin{definition}[Volume~I Grounding Contract: Doctrinal Philosophy]\\label{vol1:def:doctrinal-philosophy}%
\\lean{HomotopyCRM.DoctrinalPhilosophy}\\leanok%
Pinned read-only to Volume~I (\\texttt{def:doctrinal-philosophy}, \\texttt{docs/categorical\\_reverse\\_mathematics.tex:790}, Zenodo DOI \\texttt{10.5281/zenodo.24238086})~\\cite{Shulman08,Shulman20,HHLN23}. A \\textbf{doctrinal philosophy}\\index{Doctrinal philosophy} is a pairing $\\mathfrak{P} = (\\mathbb{D}, \\mathcal{P}, \\langle -, - \\rangle)$ together with a transition polarity $(H, C, T, K)$ on $\\mathbb{D}$ where $K \\subseteq H \\cap C$ is the non-vacuity core,
\\[
  T := (\\mathbb{D} \\setminus H) \\cup C \\quad (\\text{Assertoric Closure}), \\qquad
  W := H \\setminus C \\quad (\\text{Hard Obstructions}),
\\]
and $\\Box_{\\Sigma}(T)$ denotes the modal $S4$ \\textbf{Apodictic Closure} under a stability monoid $\\Sigma$ of product-preserving doctrinal endomorphisms.
\\end{definition}
"""

