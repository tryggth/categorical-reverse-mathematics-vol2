A doctrinal comparison triple T = (D0 >= D1, kappa : Phi => Psi) packages a Grothendieck doctrinal fibration p : E -> B (DoctrinalFibration, wrapping Functor.IsFibered, with canonical bare-doctrine terminal projection DoctrinalFibration.toTerminal) or an adjoint mate square (MateDoubleSquare with Beck-Chevalley mate involution mateDoubleSquare_mate_involutive) whose fiber defects vanish precisely along D1. Dom(Res) is the domain of all such comparison triples.
"""

