tex = """
\\begin{definition}[Volume~I Grounding Contract: Doctrinal Comparisons and Adjoint Mate Squares]\\label{vol1:def:comparison-triple}%
\\lean{HomotopyCRM.DoctrinalFibration, HomotopyCRM.MateDoubleSquare, HomotopyCRM.mateDoubleSquare_mate_involutive}\\leanwitness%
Pinned read-only to Volume~I (\\texttt{def:comparison-triple}, \\texttt{docs/categorical\\_reverse\\_mathematics.tex:624}, Zenodo DOI \\texttt{10.5281/zenodo.24238086})~\\cite{Shulman08,HHLN23,Lawvere69,Johnstone02}. A \\textbf{doctrinal fibration} $p : \\mathcal{E} \\to \\mathcal{B}$ (\\texttt{DoctrinalFibration}, specializing via the terminal projection $\\mathcal{D} \\to \\mathbf{1}$, \\texttt{DoctrinalFibration.toTerminal}) carries doctrinal structure preserved by Cartesian reindexing; when horizontal adjunctions $L \\dashv R$ and $L' \\dashv R'$ sit in a \\texttt{MateDoubleSquare}, any $2$-cell $\\alpha : L' \\circ u \\Rightarrow F \\circ L$ transposes via the involutive mate equivalence (\\texttt{mateDoubleSquare\\_mate\\_involutive}) to $\\mu_\\alpha : u \\circ R \\Rightarrow R' \\circ F$. Packaging $\\mathcal{D}_0 \\supseteq \\mathcal{D}_1$ with $\\kappa : \\Phi \\Rightarrow \\Psi$ yields a \\textbf{doctrinal comparison triple} $\\mathfrak{T} = (\\mathcal{D}_0 \\supseteq \\mathcal{D}_1, \\kappa) \\in \\mathrm{Dom}(\\mathrm{Res})$.
\\end{definition}
"""

