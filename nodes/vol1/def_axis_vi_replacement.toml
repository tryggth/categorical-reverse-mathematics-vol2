contract = """
Over a baseline predicative class-set ambient (C, S), Axis VI (Small-Indexed Cofinality / Replacement) compares the regular image Phi_Im(I, f) := im(f) in C of any morphism f : I -> C from a small domain I in S against the smallness reflector S -> C via kappa_Rep : im(f) in S. Equivalently, covariant direct image exists_g : P_S(C) -> P_S(D) preserves small subobjects and, combined with Small Union and coequalizer descent, compresses every small-indexed colimit into S.
"""

