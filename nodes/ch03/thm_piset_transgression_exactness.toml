[spec]
statement = "Over any two-sorted syntactic base-class extension system (SetTh, ClsTh, Def_syn, Tr_set) with Def_syn -| Tr_set and Tr_set(Def_syn(T)) <= T, define the Horizontal Leakage / Transgression Operator d_Set(T, tau) := Tr_set(Def_syn(T) sup tau) (and open leakage locus U_leak(T, tau) := {X <= d_Set(T, tau) | not (X <= T)}). Then: (1) Exactness Criterion: Def_syn(T) sup tau is L_in-conservative over T iff d_Set(T, tau) = bot_T (equivalently U_leak(T, tau) = empty); (2) Pullback Cartesianness Equivalence: d_Set(T_0, tau) = bot_{T_0} iff every syntactic base-change square along T_0 <= T_1 is a genuine pullback against minimal expansions Def_syn(X); (3) Base-Strengthening Absorption: strengthening T_0 <= T_1 to absorb d_Set(T_0, tau) absorbs U_leak(T_0, tau) and forces d_Set(T_1, tau) = bot_{T_1} under trace-absorption stability (such as T_1 |- Rep /\\ Reg)."
hypotheses = [
  "Sys : SyntacticClassSystem (from ch02:prop:syntactic-conservative-pullback)"
]

