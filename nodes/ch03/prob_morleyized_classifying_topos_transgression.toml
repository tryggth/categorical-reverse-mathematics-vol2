[body]
tex = """
\\begin{problem}[Sheaf-Cohomological Upgrade of {{sym:dset}} Over $\\Sigma^1_0$-Morleyized Classifying Topoi]\\label{ch03:prob:morleyized-classifying-topos-transgression}%
\\uses{vol1:thm:quantitative-conservation,ch03:thm:piset-transgression-exactness,ch03:thm:two-valve-transgression-dichotomy}%
Resolving the remaining sheaf-cohomological half of Volume~I Horizon~VIII Problem~17a (\\texttt{prob:open-17}) without metatheoretic Replacement circularity: characterize precisely when the deductive Lindenbaum/Stone open leakage locus ${{sym:uleak}}(\\mathsf{GC})$ and transgression operator ${{sym:dset}}(\\mathsf{GC})$ of Theorems~\\ref{ch03:thm:piset-transgression-exactness}--\\ref{ch03:thm:two-valve-transgression-dichotomy} upgrade to a genuine Giraud torsor--gerbe differential $d_2$ (mirroring Theorem~\\ref{vol1:thm:quantitative-conservation}~\\cite{giraud1971}) or compactly supported cohomology invariant $H^0_c({{sym:uleak}}; \\mathbb{Z})$ along a geometric morphism $\\gamma_I : \\mathcal{E}[\\mathbb{T}_{\\mathrm{Class}}] \\to \\mathcal{E}[\\mathbb{T}_{\\mathrm{Set}}]$ between $\\Sigma^1_0$-Morleyized classifying Grothendieck topoi, coupled to internal $\\mathsf{AST}$ class-forcing sheaves isolating Glazer's $\\mathsf{ZC}$ leak~\\cite{glazer2023} and Felgner's {{sym:zfc-noreg}} leak~\\cite{felgner1976} against the $\\mathsf{ZFC}$ membrane~\\cite{felgner1971}.
\\end{problem}
"""

