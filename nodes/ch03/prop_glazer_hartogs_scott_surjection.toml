[spec]
statement = "Over Replacement-free GB_0 + GC (without von Neumann ordinals above omega + omega), (1) global well-ordering induces an injective section W^+(A) >-> WO(A) splitting the canonical small-domain surjection WO(A) ->> W^+(A) from well-orderings of A <= P(A x A) onto the Hartogs/Scott prewellordering stage W^+(A) <= P^2(A x A); (2) over GBC_0 + GC, Global Choice selects uniform enumerations f_n : omega ->> X_n across Glazer's psi_fnd family, enabling G4 projection and Subclass Separation on P(omega x omega) x W_2 in S to manufacture a small partial surjection P(omega x omega) -> W_2 (equivalently P(omega) ->> W_2), refuting CH and Glazer's theta_Glz."
hypotheses = [
  "H : HartogsPreWOSystem modeling WO(A) ->> W^+(A) with globalSelect",
  "G : GlazerSeparationSystem, E : GlobalCountableEnum G modeling f_n : omega ->> X_n and G4 small graph"
]

