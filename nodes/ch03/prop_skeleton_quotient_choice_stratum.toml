[spec]
statement = "On Type u, the equipollence quotient EquipollenceQuot := Quotient EquivSetoid projects every type canonically to its cardinal class equipollenceClass alpha in the Amber quotient stratum ([propext, Quot.sound]) with choice-free surjectivity, whereas extracting a global representative section rep : EquipollenceQuot -> Type u satisfying equipollenceClass (rep q) = q together with uniform equivalences alpha ~= rep (equipollenceClass alpha) calibrates the Crimson Classical.choice stratum (previewing Chapter 9 Obstruction 2b)."
