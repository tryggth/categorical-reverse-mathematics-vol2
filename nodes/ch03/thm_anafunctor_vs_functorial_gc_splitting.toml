[spec]
statement = "Over any equipollence groupoid projection skel : S -> C surjective up to internal equivalences Eqv s1 s2, (1) Makkai's relational/anafunctor inverse span R(c, s) := (skel s = c) is unconditionally total, equipollence-saturated, single-orbit fiber-transitive, and base-coherent with zero choice hypothesis (staying inside GBC); (2) Functorial splitting (sec : C -> S with coherent transport eta : Eqv (sec (skel s)) s) is bi-definably equivalent to uniform fiberwise Global Choice; and (3) Any two splittings differ by a unique vertical gauge torsor of fiberwise automorphisms."
hypotheses = [
  "E : EquipollenceSystem.{u, v} with skel : S -> C, groupoid Eqv s1 s2, surjectivity skel_surj, and skel_eq_iff_eqv"
]

