[body]
tex = """
Section~9.1 launches Part~IV of the monograph by upgrading the zero-\\texttt{Mathlib} 2LTT kernel \\texttt{KernelArena} from the Phase~0 boolean bootstrap ({{ref:ch01:rem:trident-mode3-2ltt-bootstrap}}) to Rung~1 (slice \\texttt{plan:tcb-rung1-cubical-kan}). Rather than adding Lean axioms, the upgraded TCB keeps \\texttt{KernelArena.Check.checkCert} completely axiom-free while deciding Cartesian cofibration lattices {{sym:cofib-lat}} by pure union-find partition refinement, checking strict equality and $\\mathsf{UIP}^s$ in {{sym:univ-s}}, verifying homogeneous Kan composition {{sym:kan-hcom}} and coercion {{sym:kan-coe}} in {{sym:univ-f}}, and enabling Voevodsky-style {{sym:vtype}}-univalence \\cite{abcfhl2021,orton_pitts2018,acks2023,voevodsky_hts2013}.

Concretely, Definition~\\ref{ch09:def:cartesian-2ltt-cofibration-calculus} specifies the Rung~1 signature and regularity-safe $\\mathsf{V}$-coercion rule; Proposition~\\ref{ch09:prop:pure-kan-path-symmetry-cert} exhibits a pure Kan \\textbf{Emerald} certificate for boolean path inversion; and Theorem~\\ref{ch09:thm:bool-univalence-holonomy-cert} activates the \\textbf{Sapphire} stratum for the first time by computationally transporting $\\mathsf{false}^f$ to $\\mathsf{true}^f$ around the $\\mathbb{Z}/2\\mathbb{Z}$ univalent loop $\\mathsf{ua}(\\mathsf{not})$.
"""

