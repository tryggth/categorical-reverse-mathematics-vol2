/-- Recursive constructive length-indexed tuple `Tuple α n` (zero `Classical.choice`, zero `propext`). -/
def Tuple (α : Type) : Nat → Type
  | 0 => PUnit
  | n + 1 => α × Tuple α n

/-- Three-element subobject classifier `Ω_{ℳ₁} = {bot < mid < top}` of `Set^{ℳ₁}`. -/
inductive OmegaM1V2 : Type
  | bot
  | mid
  | top

/-- `e₁`-division action on `Ω_{ℳ₁}`. -/
def OmegaM1V2.eAct : OmegaM1V2 → OmegaM1V2
  | .bot => .bot
  | .mid => .top
  | .top => .top

/-- Boolean order `≤` on `Ω_{ℳ₁}`. -/
def OmegaM1V2.leBool : OmegaM1V2 → OmegaM1V2 → Bool
  | .bot, .bot => true
  | .bot, .mid => true
  | .bot, .top => true
  | .mid, .bot => false
  | .mid, .mid => true
  | .mid, .top => true
  | .top, .bot => false
  | .top, .mid => false
  | .top, .top => true

/-- Endomap of `Ω_{ℳ₁}` determined by its three images. -/
structure OmegaMap : Type where
  /-- Image of `bot`. -/
  atBot : OmegaM1V2
  /-- Image of `mid`. -/
  atMid : OmegaM1V2
  /-- Image of `top`. -/
  atTop : OmegaM1V2

/-- Pointwise evaluation of `OmegaMap`. -/
def OmegaMap.eval (f : OmegaMap) : OmegaM1V2 → OmegaM1V2
  | .bot => f.atBot
  | .mid => f.atMid
  | .top => f.atTop

/-- Lawvere–Tierney nucleus laws on `Ω_{ℳ₁}` (preserves `⊤`, monotone, idempotent). -/
def OmegaMap.IsNucleus (f : OmegaMap) : Prop :=
  f.atTop = .top ∧
  OmegaM1V2.leBool f.atBot f.atMid = true ∧
  OmegaM1V2.leBool f.atMid f.atTop = true ∧
  f.eval f.atBot = f.atBot ∧
  f.eval f.atMid = f.atMid

/-- `ℳ₁`-equivariance `j_{ρ(x)}(e₁ · ω) = e₁ · j_x(ω)`. -/
def OmegaMap.IsEquivOver (base f : OmegaMap) : Prop :=
  base.atBot = f.atBot.eAct ∧
  base.atTop = f.atMid.eAct ∧
  base.atTop = f.atTop.eAct

/-- Equivariant nuclei on a fixed point `ρ(a) = a` (`3` choices). -/
def FixedNucleus : Type :=
  { f : OmegaMap // f.IsNucleus ∧ f.IsEquivOver f }

/-- Map `Fin 3 → FixedNucleus` (`0 = id`, `1 = j_loc`, `2 = ⊤`, zero axioms). -/
def fixedNucleusOfFin3 : Fin 3 → FixedNucleus
  | ⟨0, _⟩ => ⟨⟨.bot, .mid, .top⟩, ⟨rfl, rfl, rfl, rfl, rfl⟩, ⟨rfl, rfl, rfl⟩⟩
  | ⟨1, _⟩ => ⟨⟨.bot, .top, .top⟩, ⟨rfl, rfl, rfl, rfl, rfl⟩, ⟨rfl, rfl, rfl⟩⟩
  | ⟨2, _⟩ => ⟨⟨.top, .top, .top⟩, ⟨rfl, rfl, rfl, rfl, rfl⟩, ⟨rfl, rfl, rfl⟩⟩
  | ⟨n + 3, hn⟩ =>
    False.elim (Nat.not_lt_zero n
      (Nat.lt_of_succ_lt_succ (Nat.lt_of_succ_lt_succ (Nat.lt_of_succ_lt_succ hn))))

/-- Map `FixedNucleus → Fin 3` without wildcards or `by decide` (zero axioms). -/
def fin3OfFixedNucleus (x : FixedNucleus) : Fin 3 :=
  match x.1.atBot, x.1.atMid with
  | .bot, .mid => ⟨0, Nat.zero_lt_succ 2⟩
  | .bot, .top => ⟨1, Nat.succ_lt_succ (Nat.zero_lt_succ 1)⟩
  | .bot, .bot => ⟨2, Nat.succ_lt_succ (Nat.succ_lt_succ (Nat.zero_lt_succ 0))⟩
  | .mid, .bot => ⟨2, Nat.succ_lt_succ (Nat.succ_lt_succ (Nat.zero_lt_succ 0))⟩
  | .mid, .mid => ⟨2, Nat.succ_lt_succ (Nat.succ_lt_succ (Nat.zero_lt_succ 0))⟩
  | .mid, .top => ⟨2, Nat.succ_lt_succ (Nat.succ_lt_succ (Nat.zero_lt_succ 0))⟩
  | .top, .bot => ⟨2, Nat.succ_lt_succ (Nat.succ_lt_succ (Nat.zero_lt_succ 0))⟩
  | .top, .mid => ⟨2, Nat.succ_lt_succ (Nat.succ_lt_succ (Nat.zero_lt_succ 0))⟩
  | .top, .top => ⟨2, Nat.succ_lt_succ (Nat.succ_lt_succ (Nat.zero_lt_succ 0))⟩

/-- Left inverse `fixedNucleusOfFin3 ∘ fin3OfFixedNucleus = id` (zero axioms). -/
theorem fixedNucleus_left_inv (x : FixedNucleus) :
    fixedNucleusOfFin3 (fin3OfFixedNucleus x) = x := by
  rcases x with ⟨⟨a, b, c⟩, ⟨hc, hbm, hmt, hbb, hmm⟩, ⟨heb, hem, het⟩⟩
