[spec]
statement = "Flow F3 (Reflective Localization Trajectories): (a) Over any finite idempotent M_1-set (X, rho) with k fixed points and m non-fixed points, LTT(Set^{M_1}/X) is in constructive bijection with (Fin 3)^k x (Fin 2)^m and partitions into 3^k * 2^m = 2^(k+m) + (3^k - 2^k) * 2^m localic vs. non-Boolean slice topologies; (b) upward-closed non-meet-closed validity loci in LTT(Eff) produce a 2-element localization Pareto Schism {j_1, j_2} strictly above a non-trivial Muchnik meet j_1 /\\ j_2 > id_Omega (Guardrail 3)."

