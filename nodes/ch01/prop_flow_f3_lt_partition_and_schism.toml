/-- Right inverse `fin3OfFixedNucleus ∘ fixedNucleusOfFin3 = id` (zero axioms). -/
theorem fixedNucleus_right_inv : ∀ i : Fin 3,
    fin3OfFixedNucleus (fixedNucleusOfFin3 i) = i
  | ⟨0, _⟩ => rfl
  | ⟨1, _⟩ => rfl
  | ⟨2, _⟩ => rfl
  | ⟨n + 3, hn⟩ =>
    False.elim (Nat.not_lt_zero n (Nat.lt_of_succ_lt_succ (Nat.lt_of_succ_lt_succ (Nat.lt_of_succ_lt_succ hn))))

/-- Equivariant nuclei on a non-fixed point `x ≠ ρ(x)` above `base = j_{ρ(x)}` (`2` choices). -/
def NonFixedNucleus (base : FixedNucleus) : Type :=
  { f : OmegaMap // f.IsNucleus ∧ base.1.IsEquivOver f }

/-- Map `Fin 2 → NonFixedNucleus base` (zero axioms). -/
def nonFixedNucleusOfFin2 (base : FixedNucleus) : Fin 2 → NonFixedNucleus base
  | ⟨0, _⟩ =>
    match h : base.1.atBot with
    | .bot => ⟨⟨.bot, .mid, .top⟩, ⟨rfl, rfl, rfl, rfl, rfl⟩, ⟨h, base.2.1.1, base.2.1.1⟩⟩
    | .mid => False.elim (by
        have he := base.2.2.1
        rw [h] at he
        exact OmegaM1V2.noConfusion he)
    | .top => ⟨⟨.mid, .mid, .top⟩, ⟨rfl, rfl, rfl, rfl, rfl⟩, ⟨h, base.2.1.1, base.2.1.1⟩⟩
  | ⟨1, _⟩ =>
    match h : base.1.atBot with
    | .bot => ⟨⟨.bot, .top, .top⟩, ⟨rfl, rfl, rfl, rfl, rfl⟩, ⟨h, base.2.1.1, base.2.1.1⟩⟩
    | .mid => False.elim (by
        have he := base.2.2.1
        rw [h] at he
        exact OmegaM1V2.noConfusion he)
    | .top => ⟨⟨.top, .top, .top⟩, ⟨rfl, rfl, rfl, rfl, rfl⟩, ⟨h, base.2.1.1, base.2.1.1⟩⟩
  | ⟨n + 2, hn⟩ =>
    False.elim (Nat.not_lt_zero n (Nat.lt_of_succ_lt_succ (Nat.lt_of_succ_lt_succ hn)))

/-- Map `NonFixedNucleus base → Fin 2` without wildcards (zero axioms). -/
def fin2OfNonFixedNucleus {base : FixedNucleus} (x : NonFixedNucleus base) : Fin 2 :=
  match x.1.atMid with
  | .bot => ⟨0, Nat.zero_lt_succ 1⟩
  | .mid => ⟨0, Nat.zero_lt_succ 1⟩
  | .top => ⟨1, Nat.succ_lt_succ (Nat.zero_lt_succ 0)⟩

/-- Left inverse `nonFixedNucleusOfFin2 base ∘ fin2OfNonFixedNucleus = id` (zero axioms). -/
