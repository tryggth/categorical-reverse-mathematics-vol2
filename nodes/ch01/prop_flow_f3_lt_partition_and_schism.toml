  · exact False.elim (OmegaM1V2.noConfusion hc)
  · exact False.elim (OmegaM1V2.noConfusion hc)
  · exact False.elim (OmegaM1V2.noConfusion heb)
  · exact False.elim (OmegaM1V2.noConfusion hc)
