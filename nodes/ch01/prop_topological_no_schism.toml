[spec]
statement = "For any intersection-closed extent family M subset P(D) that is also closed under binary set-theoretic unions (E1, E2 in M implies E1 cup E2 in M), the Living-Zone poset F = {R in M | K subseteq R subseteq T} has at most one inclusion-maximal element up to extensional equivalence (R1, R2 in Max(F) implies R1 = R2). By contrast, J_ext-multiplicativity (closure under doctrinal products) breaks binary union closure and permits Pareto Schisms."
hypotheses = [
  "M : Set (Set D) closed under binary set-theoretic unions (IsBinaryUnionClosed M)",
  "R1, R2 inclusion-maximal in the Living-Zone poset F = { R in M | K <= R <= T }"
]

