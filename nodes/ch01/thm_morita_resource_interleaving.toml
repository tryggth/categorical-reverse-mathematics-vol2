[spec]
statement = "Across any syntactic pretopos bi-interpretation (I, J; eta, epsilon) between theories T1 and T2 with forward distortion (a, b) in N_{>=1} x N and backward distortion (a', b') in N_{>=1} x N, the descending game-comonad equivalence towers satisfy two-sided quasi-isometric resource interleaving: (equiv_{a*k+b}^{E,T1}) <= I*(equiv_k^{E,T2}), I*(equiv_{a'*m+b'}^{E,T2}) <= (equiv_m^{E,T1}), the floor-bound corollary I*(equiv_k^{E,T2}) <= (equiv_{floor((k-b')/a')}^{E,T1}) for k >= b', and exact k = infty invariance intersect_k equiv_k^{E,T1} = I*(intersect_k equiv_k^{E,T2})."
hypotheses = [
  "DescendingResourceTower tau_1 on Mod(T1) and DescendingResourceTower tau_2 on Mod(T2)",
  "DistortedBiInterpretation B with forward distortion (a, b) (a >= 1) and backward distortion (a', b') (a' >= 1)",
  "Unit isomorphism invariance eta_x : x ~= J(I(x)) at all resource depths"
]

