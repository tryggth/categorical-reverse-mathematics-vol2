[body]
tex = """
Building directly on the doctrinal philosophy framework of Volume~I ({{ref:vol1:def:doctrinal-philosophy}}) and Shulman's 2-Chu-Dialectica pairing~\\cite{Shulman20}, Volume~II systematizes the calibration of structural probe suites {{sym:probe-suite}} across universes, classes, and higher fixed points. Paralleling the categorical resource and game-comonad program of Abramsky, Dawar, Jakl, Paine, and Reggio~\\cite{abramsky2022,abramsky_reggio2021,dawar_jakl_reggio2021,reggio2021,abramsky_jakl_paine2022} alongside realizability topology lattices~\\cite{Kihara23}, Definition~\\ref{ch01:def:probe-suite} isolates a decidable probe incidence matrix $I : \\mathbb{D} \\times {{sym:probe-suite}} \\to \\mathbf{Bool}$ constrained by Pre-Definition, Strict Non-Conservativity, and \\textbf{L\\'evy-Bounded Size Discipline} (a bounded $\\Sigma_1$ / small-site L\\'evy complexity witness preventing Vop\\v{e}nka reflection leaks), and generating Touchstone hyperedges $H_K(w)$ for each defect $w \\in W = H \\setminus C$.

Under Definition~\\ref{ch01:def:adm-pareto-frontier}, admissible extents $\\mathrm{Adm}_{{{sym:probe-suite}}}$ form a refinement poset whose inclusion-maximal minimal Pareto frontier {{sym:pareto-res}} partitions cleanly into Provable Scotoma ($\\emptyset$), Unique Conceptual Residuum ($|\\mathrm{Res}^{\\min}| = 1$), or Multi-Dimensional Pareto Schism ($|\\mathrm{Res}^{\\min}| \\ge 2$) by Theorem~\\ref{ch01:thm:scotoma-pareto-trichotomy}. Along a monotone probe filtration $\\mathcal{P}_t$, Theorem~\\ref{ch01:thm:flow-f1-threshold-order} proves unconditionally that the awakening threshold precedes the dogma threshold (${{sym:twake}} \\le {{sym:tdogma}}$). Crucially, however, Counterexample~\\ref{ch01:cex:flow-f1-frontier-nonmonotone} demonstrates why $|{{sym:pareto-res}}|$ need not vary monotonically inside $[{{sym:twake}}, {{sym:tdogma}})$: new probes introduced at intermediate stages can first split a single admissible residuum into an incomparable Pareto Schism ($1 \\mapsto 2$) before a subsequent coarser unifying probe subsumes both branches back into a single strictly weaker residuum ($2 \\mapsto 1$) without ever collapsing $T$ into Dogma. Finally, {{ref:ch01:rem:trident-mode3-2ltt-bootstrap}} previews the zero-\\texttt{Mathlib} two-level type theory kernel boundary separating fibrant and strict types.
"""

