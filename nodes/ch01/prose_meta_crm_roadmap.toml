[body]
tex = """
Building directly on the doctrinal philosophy framework of Volume~I ({{ref:vol1:def:doctrinal-philosophy}}) and Shulman's 2-Chu-Dialectica pairing~\\cite{Shulman20}, Volume~II systematizes the calibration of structural probe suites {{sym:probe-suite}} across universes, classes, and higher fixed points. Paralleling the categorical resource and game-comonad program of Abramsky, Dawar, Jakl, Paine, and Reggio~\\cite{abramsky2022,abramsky_reggio2021,dawar_jakl_reggio2021,reggio2021,abramsky_jakl_paine2022} alongside realizability topology lattices~\\cite{Kihara23}, Definition~\\ref{ch01:def:probe-suite} isolates a decidable probe incidence matrix $I : \\mathbb{D} \\times {{sym:probe-suite}} \\to \\mathbf{Bool}$ constrained by Pre-Definition, Strict Non-Conservativity, and \\textbf{L\\'evy-Bounded Size Discipline} (a bounded $\\Sigma_1$ / small-site L\\'evy complexity witness preventing Vop\\v{e}nka reflection leaks), and generating Touchstone hyperedges $H_K(w)$ for each defect $w \\in W = H \\setminus C$.

Under Definition~\\ref{ch01:def:adm-pareto-frontier}, admissible extents $\\mathrm{Adm}_{{{sym:probe-suite}}}$ form a refinement poset whose inclusion-maximal minimal Pareto frontier {{sym:pareto-res}} partitions cleanly into Provable Scotoma ($\\emptyset$), Unique Conceptual Residuum ($|\\mathrm{Res}^{\\min}| = 1$), or Multi-Dimensional Pareto Schism ($|\\mathrm{Res}^{\\min}| \\ge 2$) by Theorem~\\ref{ch01:thm:scotoma-pareto-trichotomy}. Along a monotone probe filtration $\\mathcal{P}_t$, Theorem~\\ref{ch01:thm:flow-f1-threshold-order} proves unconditionally that the awakening threshold precedes the dogma threshold (${{sym:twake}} \\le {{sym:tdogma}}$). Crucially, however, Counterexample~\\ref{ch01:cex:flow-f1-frontier-nonmonotone} demonstrates why $|{{sym:pareto-res}}|$ need not vary monotonically inside $[{{sym:twake}}, {{sym:tdogma}})$: new probes introduced at intermediate stages can first split a single admissible residuum into an incomparable Pareto Schism ($1 \\mapsto 2$) before a subsequent coarser unifying probe subsumes both branches back into a single strictly weaker residuum ($2 \\mapsto 1$) without ever collapsing $T$ into Dogma. Moreover, {{ref:ch01:rem:trident-mode3-2ltt-bootstrap}} previews the zero-\\texttt{Mathlib} two-level type theory kernel boundary separating fibrant and strict types.

Sections~1.2--1.5 complete Chapter~1's Meta-CRM calculus across dualities, intrinsic site characterizations, and operational resource translation. In \\S\\S 1.2--1.3, 2-Chu extent--transversal duality, Touchstone Specific Gravity, hereditary subterminal projectivity, and Doctrinal Stability Flows~F2--F4 govern localization and mixed-variance transport across realizability topoi. In \\S 1.4, {{ref:ch01:prop:topological-no-schism}} shows constructively that binary union closure forces at most one Living-Zone maximum whereas {{sym:j-ext}}-multiplicativity unlocks Pareto Schisms, {{ref:ch01:thm:zero-giraud-representation}} establishes an axiom-free $0$-Giraud representation theorem for~\\textup{(P1)+(P3)+(P4)+(P5)} simultaneously banishing Dogma and Immortal Casuistry, {{ref:ch01:thm:zero-giraud-living-zone-zorn}} derives Living-Zone existence under~\\textup{(P0)+(P2)} via Zorn's Lemma, {{ref:ch01:cex:p0-independent-of-p1-p5}} separates~\\textup{(P0)} from~\\textup{(P1)--(P5)} on a $4$-element join-semilattice, and {{ref:ch01:prob:two-giraud-prototopos-nerve}} poses the $2$-categorical prototopos nerve problem~\\cite{diliberti_ramos2019,diliberti_tarantino_ye2026}. Finally, \\S 1.5 introduces the four CRM Operational Currencies ({{ref:ch01:def:operational-currencies}}), links game-comonad coalgebra numbers~({{ref:ch01:claim:abramsky-arboreal-coalgebra-numbers}}), proves two-sided $(a,b)/(a',b')$ descending-filtration Morita Resource Interleaving and $k = \\infty$ invariance ({{ref:ch01:thm:morita-resource-interleaving}})~\\cite{abramsky_shah2021}, and certifies the Russell's Socks $k=1$ failure / $k=2$ separation Touchstone ({{ref:ch01:cex:russells-socks-levelwise-morita-failure}}).
"""

