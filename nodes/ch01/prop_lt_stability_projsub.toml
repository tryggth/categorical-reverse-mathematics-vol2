[spec]
statement = "For every elementary topos E and every Lawvere-Tierney topology j on E, if E satisfies hereditary subterminal projectivity (Proj_sub = SS), then its sheaf subtopos Sh_j(E) also satisfies Proj_sub: every epimorphism p : X ->> V onto a subterminal V >-> 1 in Sh_j(E) admits a section sigma : V -> X."
hypotheses = [
  "Elementary topos E satisfying Proj_sub",
  "Lawvere-Tierney topology j : Omega_E -> Omega_E"
]

[spec.mathlib]
module = "HomotopyCRM.Vol2.DoctrinalFlows"
imports = []
