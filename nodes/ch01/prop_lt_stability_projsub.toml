]
expected_axioms = []
lean_signature = """
/-- Reflective exact subterminal epi-mono transport system modeling `a_j ⊣ i : Sh_j(E) ↪ E`. -/
structure ReflectiveSubterminalSystem : Type 1 where
  /-- Objects of ambient topos `E`. -/
  ObjE : Type
  /-- Morphisms of `E`. -/
  HomE : ObjE → ObjE → Type
  /-- Identity in `E`. -/
  idE : ∀ X : ObjE, HomE X X
  /-- Composition in `E`. -/
  compE : ∀ {X Y Z : ObjE}, HomE Y Z → HomE X Y → HomE X Z
  /-- Subterminal predicate in `E`. -/
  IsSubterminalE : ObjE → Prop
  /-- Epimorphism predicate in `E`. -/
  IsEpiE : ∀ {X Y : ObjE}, HomE X Y → Prop
  /-- Monomorphism predicate in `E`. -/
  IsMonoE : ∀ {X Y : ObjE}, HomE X Y → Prop
  /-- Objects of sheaf subtopos `Sh_j(E)`. -/
  ObjS : Type
  /-- Morphisms of `Sh_j(E)`. -/
  HomS : ObjS → ObjS → Type
  /-- Identity in `Sh_j(E)`. -/
  idS : ∀ X : ObjS, HomS X X
  /-- Composition in `Sh_j(E)`. -/
  compS : ∀ {X Y Z : ObjS}, HomS Y Z → HomS X Y → HomS X Z
  /-- Associativity in `Sh_j(E)`. -/
  assocS : ∀ {W X Y Z : ObjS} (h : HomS Y Z) (g : HomS X Y) (f : HomS W X),
    compS (compS h g) f = compS h (compS g f)
  /-- Left identity in `Sh_j(E)`. -/
  id_compS : ∀ {X Y : ObjS} (f : HomS X Y), compS (idS Y) f = f
  /-- Right identity in `Sh_j(E)`. -/
  comp_idS : ∀ {X Y : ObjS} (f : HomS X Y), compS f (idS X) = f
  /-- Subterminal predicate in `Sh_j(E)`. -/
  IsSubterminalS : ObjS → Prop
  /-- Epimorphism predicate in `Sh_j(E)`. -/
  IsEpiS : ∀ {X Y : ObjS}, HomS X Y → Prop
  /-- Inclusion functor `i : Sh_j(E) ↪ E`. -/
  iObj : ObjS → ObjE
  /-- Action of `i` on morphisms. -/
  iMap : ∀ {X Y : ObjS}, HomS X Y → HomE (iObj X) (iObj Y)
  /-- Sheafification reflector `a_j : E → Sh_j(E)`. -/
  aObj : ObjE → ObjS
  /-- Action of `a_j` on morphisms. -/
  aMap : ∀ {X Y : ObjE}, HomE X Y → HomS (aObj X) (aObj Y)
  /-- Functoriality on identities. -/
  a_id : ∀ X : ObjE, aMap (idE X) = idS (aObj X)
  /-- Functoriality on composition. -/
  a_comp : ∀ {X Y Z : ObjE} (g : HomE Y Z) (f : HomE X Y),
    aMap (compE g f) = compS (aMap g) (aMap f)
  /-- Reflection isomorphism counit `ε_X : a_j(i X) ≅ X`. -/
  eps : ∀ X : ObjS, HomS (aObj (iObj X)) X
  /-- Inverse counit `ε_X⁻¹ : X ≅ a_j(i X)`. -/
  epsInv : ∀ X : ObjS, HomS X (aObj (iObj X))
  /-- Right inverse law `ε ∘ ε⁻¹ = id`. -/
  eps_inv_right : ∀ X : ObjS, compS (eps X) (epsInv X) = idS X
  /-- Naturality of `ε`. -/
  eps_nat : ∀ {X Y : ObjS} (f : HomS X Y),
    compS f (eps X) = compS (eps Y) (aMap (iMap f))
  /-- Right adjoint `i` preserves subterminals. -/
  i_preserves_subterminal : ∀ V : ObjS, IsSubterminalS V → IsSubterminalE (iObj V)
  /-- Epi-mono factorization in `E` with subterminal image `W ≤ i(V) ≤ 1_E`. -/
  epiMonoFactor : ∀ {X Y : ObjE} (f : HomE X Y),
    IsSubterminalE Y →
    ∃ (W : ObjE) (q : HomE X W) (m : HomE W Y),
      IsSubterminalE W ∧ IsEpiE q ∧ IsMonoE m ∧ compE m q = f
  /-- Exactness of `a_j` turns `m` into an epi+mono hence isomorphism in the balanced topos `Sh_j(E)`. -/
  a_mono_of_sheafEpi_iso : ∀ {X V : ObjS} (p : HomS X V) {W : ObjE}
    (q : HomE (iObj X) W) (m : HomE W (iObj V)),
    IsEpiS p → IsEpiE q → IsMonoE m → compE m q = iMap p →
    ∃ mInv : HomS (aObj (iObj V)) (aObj W),
      compS (aMap m) mInv = idS (aObj (iObj V))

/-- Ambient `Proj_sub`: every epimorphism onto a subterminal splits in `E`. -/
def HasProjSubE (R : ReflectiveSubterminalSystem) : Prop :=
  ∀ {X W : R.ObjE} (q : R.HomE X W), R.IsSubterminalE W → R.IsEpiE q →
    ∃ s : R.HomE W X, R.compE q s = R.idE W

/-- Subtopos `Proj_sub`: every epimorphism onto a subterminal splits in `Sh_j(E)`. -/
def HasProjSubS (R : ReflectiveSubterminalSystem) : Prop :=
  ∀ {X V : R.ObjS} (p : R.HomS X V), R.IsSubterminalS V → R.IsEpiS p →
    ∃ σ : R.HomS V X, R.compS p σ = R.idS V

/-- Concrete inhabited witness of `ReflectiveSubterminalSystem`. -/
def unitReflectiveSystem : ReflectiveSubterminalSystem where
  ObjE := PUnit
  HomE _ _ := PUnit
  idE _ := ()
  compE _ _ := ()
  IsSubterminalE _ := True
  IsEpiE _ := True
  IsMonoE _ := True
  ObjS := PUnit
  HomS _ _ := PUnit
  idS _ := ()
  compS _ _ := ()
  assocS _ _ _ := rfl
  id_compS _ := rfl
  comp_idS _ := rfl
  IsSubterminalS _ := True
  IsEpiS _ := True
  iObj x := x
  iMap f := f
  aObj x := x
  aMap f := f
  a_id _ := rfl
  a_comp _ _ := rfl
  eps _ := ()
  epsInv _ := ()
  eps_inv_right _ := rfl
  eps_nat _ := rfl
  i_preserves_subterminal _ _ := trivial
  epiMonoFactor _ _ := ⟨(), (), (), trivial, trivial, trivial, rfl⟩
  a_mono_of_sheafEpi_iso := by intros; exact ⟨(), rfl⟩

/-- **Witness Core (`reflective_preserves_projSub`):** Diagram-chase transport of `Proj_sub` from
    `E` to `Sh_j(E)` via epi-mono factorization and sheafification reflection (zero axioms). -/
theorem reflective_preserves_projSub (R : ReflectiveSubterminalSystem)
    (hE : HasProjSubE R) : HasProjSubS R := by
  {{LEAN_BODY}}
"""
