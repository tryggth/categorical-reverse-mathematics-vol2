[spec]
statement = "Let (F : D1 -> D2, G : P2 -> P1) be a mixed-variance morphism between doctrinal philosophies preserving cores and obstructions (F[K1] <= K2, F[W1] <= W2). Under oplax core preservation I2(F k, p2) <= I1(k, G p2) on K1 and lax obstruction hitting I1(w, G p2) <= I2(F w, p2) on W1, every admissible transversal Theta2 on A2 pulls back to an admissible transversal G[Theta2] on A1. Under strict Chu adjunction I2(F d, p2) = I1(d, G p2), Touchstone hyperedges pull back exactly: H_{K2}(F(w)) = G^{-1}(H_{K1}(w))."
hypotheses = [
  "Mixed-variance pair F : D1 -> D2, G : P2 -> P1",
  "Core preservation ∀ k, K1 k -> K2 (F k) and obstruction preservation ∀ w, W1 w -> W2 (F w)",
  "Oplax core polarity on K1 and lax obstruction polarity on W1"
]

