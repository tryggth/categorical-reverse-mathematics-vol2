[spec]
statement = "Let T1 be the theory of pairs of socks (carrier X, pair equivalence E, irreflexive symmetric mismatch relation D subseteq E \\ Delta_X) and T2 be its Morita-equivalent quotient presentation adjoining pair sort Q = X / E, projection graph G_pi, and definable quotient predicate Mis(q). Certify constructively with zero axioms (Emerald): (1) an explicit model bijection SockModelT1 equiv SockModelT2 (J(I(M)) = M), (2) two-sock models matchedPair and mismatchedPair satisfy matchedPair equiv_1^E mismatchedPair in T1, (3) I(matchedPair) not equiv_1^E I(mismatchedPair) already at k = 1 in T2, and (4) matchedPair not equiv_2^E mismatchedPair separates at k = 2 in T1."

