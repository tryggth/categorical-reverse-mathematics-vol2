lean_signature = """
/-- Constructive order-dual wrapper for `Set α` (avoiding `Classical.choice` and `Quot.sound`). -/
structure DualSet (α : Type) : Type where
  /-- Underlying subset of `α`. -/
  val : Set α

/-- Constructive inclusion preorder on `Set α`. -/
def chuSetPreorder {α : Type} : Preorder (Set α) where
  le U V := ∀ x, U x → V x
  lt U V := (∀ x, U x → V x) ∧ ¬ (∀ x, V x → U x)
  le_refl _ _ hx := hx
  le_trans _ _ _ h1 h2 _ hx := h2 _ (h1 _ hx)
  lt_iff_le_not_ge _ _ := Iff.rfl

/-- Constructive reversed inclusion preorder on `DualSet α`. -/
def dualSetPreorder {α : Type} : Preorder (DualSet α) where
  le Q₁ Q₂ := ∀ p, Q₂.val p → Q₁.val p
  lt Q₁ Q₂ := (∀ p, Q₂.val p → Q₁.val p) ∧ ¬ (∀ p, Q₁.val p → Q₂.val p)
  le_refl _ _ hp := hp
  le_trans _ _ _ h1 h2 _ hp := h1 _ (h2 _ hp)
  lt_iff_le_not_ge _ _ := Iff.rfl

/-- Definable extent `Ext_I(Q) = { d | ∀ p, Q p → I d p = true }`. -/
def extentOf {D P : Type} (I : D → P → Bool) (Q : Set P) : Set D :=
  fun d ↦ ∀ p, Q p → I d p = true

/-- Probe theory `Th_I(U) = { p | ∀ d, U d → I d p = true }`. -/
def theoryOf {D P : Type} (I : D → P → Bool) (U : Set D) : Set P :=
  fun p ↦ ∀ d, U d → I d p = true

/-- Pointwise agreement between `extentOf S.I` and `probeExtent S`. -/
theorem extentOf_iff_probeExtent {D P : Type} {Φ : DoctrinalProblem D} (S : ProbeSuite Φ P)
    (Q : Set P) (d : D) : extentOf S.I Q d ↔ probeExtent S Q d :=
  Iff.rfl

/-- Pointwise agreement between `theoryOf S.I` and `probeTheory S`. -/
theorem theoryOf_iff_probeTheory {D P : Type} {Φ : DoctrinalProblem D} (S : ProbeSuite Φ P)
    (U : Set D) (p : P) : theoryOf S.I U p ↔ probeTheory S U p :=
  Iff.rfl

/-- Antitone Galois connection between subsets of `D` and dualized probe bundles in `DualSet P`. -/
theorem chu_galois_connection {D P : Type} (I : D → P → Bool) :
    @GaloisConnection (Set D) (DualSet P) chuSetPreorder dualSetPreorder
      (fun U : Set D ↦ ⟨theoryOf I U⟩)
      (fun Q : DualSet P ↦ extentOf I Q.val) := by
  {{LEAN_BODY}}

/-- Closed extent `Ext_I(Th_I(E)) ⊆ E` (modulo `E ⊆ Ext_I(Th_I(E))`). -/
def IsClosedChuExtent {D P : Type} (I : D → P → Bool) (E : Set D) : Prop :=
  ∀ d, extentOf I (theoryOf I E) d → E d

/-- Admissible closed extent inside the interval `[K, T]`. -/
def IsAdmissibleChuExtent {D P : Type} {Φ : DoctrinalProblem D} (I : D → P → Bool)
    (E : Set D) : Prop :=
  IsClosedChuExtent I E ∧ ExtentSub Φ.K E ∧ ExtentSub E Φ.T

/-- Admissible probe bundle `Q ⊆ P`: all probes in `Q` hold on `K` and `Ext_I(Q) ⊆ T`. -/
def IsAdmissibleBundle {D P : Type} {Φ : DoctrinalProblem D} (I : D → P → Bool)
    (Q : Set P) : Prop :=
  (∀ k, Φ.K k → ∀ p, Q p → I k p = true) ∧ ExtentSub (extentOf I Q) Φ.T

/-- Extent-equivalence of probe bundles `Ext_I(Q₁) ≡ Ext_I(Q₂)`. -/
def BundleEquiv {D P : Type} (I : D → P → Bool) (Q₁ Q₂ : Set P) : Prop :=
  ExtentSub (extentOf I Q₁) (extentOf I Q₂) ∧ ExtentSub (extentOf I Q₂) (extentOf I Q₁)

/-- Inclusion-maximal admissible extent in `M_[K,T]`. -/
def IsMaximalAdmissibleExtent {D P : Type} {Φ : DoctrinalProblem D} (I : D → P → Bool)
    (E : Set D) : Prop :=
  IsAdmissibleChuExtent (Φ := Φ) I E ∧
    ∀ E', IsAdmissibleChuExtent (Φ := Φ) I E' → ExtentSub E E' → ExtentSub E' E

/-- Deductively minimal Prime Transversal bundle (least restrictive up to extent-equivalence). -/
def IsMinimalPrimeTransversal {D P : Type} {Φ : DoctrinalProblem D} (I : D → P → Bool)
    (Q : Set P) : Prop :=
  IsAdmissibleBundle (Φ := Φ) I Q ∧
    ∀ Q', IsAdmissibleBundle (Φ := Φ) I Q' →
      ExtentSub (extentOf I Q) (extentOf I Q') → BundleEquiv I Q Q'

/-- `extentOf I Q` of an admissible bundle `Q` is an admissible closed extent. -/
theorem extentOf_isAdmissible {D P : Type} {Φ : DoctrinalProblem D} (I : D → P → Bool)
    (Q : Set P) (hQ : IsAdmissibleBundle (Φ := Φ) I Q) :
    IsAdmissibleChuExtent (Φ := Φ) I (extentOf I Q) := by
  refine ⟨fun d hd p hp ↦ hd p (fun _ hx ↦ hx p hp), fun k hk p hp ↦ hQ.1 k hk p hp, hQ.2⟩

/-- `theoryOf I E` of an admissible extent `E` is an admissible probe bundle. -/
theorem theoryOf_isAdmissible {D P : Type} {Φ : DoctrinalProblem D} (I : D → P → Bool)
    (E : Set D) (hE : IsAdmissibleChuExtent (Φ := Φ) I E) :
    IsAdmissibleBundle (Φ := Φ) I (theoryOf I E) :=
  ⟨fun k hk _ hp ↦ hp k (hE.2.1 k hk), fun d hd ↦ hE.2.2 d (hE.1 d hd)⟩

/-- Unit/counit extent identity for closed admissible extents: `Ext_I(Th_I(E)) ↔ E`. -/
theorem extentOf_theoryOf_iff {D P : Type} {Φ : DoctrinalProblem D} (I : D → P → Bool)
    (E : Set D) (hE : IsAdmissibleChuExtent (Φ := Φ) I E) (d : D) :
    extentOf I (theoryOf I E) d ↔ E d :=
  ⟨fun hd ↦ hE.1 d hd, fun hd _ hp ↦ hp d hd⟩

/-- Bundle equivalence `Th_I(Ext_I(Q)) ≡_ext Q` for every probe bundle `Q`. -/
theorem theoryOf_extentOf_bundleEquiv {D P : Type} (I : D → P → Bool) (Q : Set P) :
    BundleEquiv I (theoryOf I (extentOf I Q)) Q :=
  ⟨fun _ hd p hp ↦ hd p (fun _ hy ↦ hy p hp), fun _ hd _ hp ↦ hp _ hd⟩

/-- **Maximal-vs.-Minimal Reconciliation:** `E = Ext_I(Q)` is inclusion-maximal in `M_[K,T]`
    if and only if `Q` is a refinement-minimal Prime Transversal. -/
theorem extent_max_iff_transversal_min {D P : Type} {Φ : DoctrinalProblem D} (I : D → P → Bool)
    (Q : Set P) :
    IsMaximalAdmissibleExtent (Φ := Φ) I (extentOf I Q) ↔
      IsMinimalPrimeTransversal (Φ := Φ) I Q := by
  constructor
  · rintro ⟨hAdmE, hMax⟩
    refine ⟨⟨fun k hk p hp ↦ hAdmE.2.1 k hk p hp, hAdmE.2.2⟩, fun Q' hQ' hSub ↦ ?_⟩
    exact ⟨hSub, hMax (extentOf I Q') (extentOf_isAdmissible I Q' hQ') hSub⟩
  · rintro ⟨hAdmQ, hMin⟩
    refine ⟨extentOf_isAdmissible I Q hAdmQ, fun E' hE' hSub ↦ ?_⟩
    have hBundle := hMin (theoryOf I E') (theoryOf_isAdmissible I E' hE')
      (fun d hd p hp ↦ hp d (hSub d hd))
    exact fun d hd ↦ hBundle.2 d ((extentOf_theoryOf_iff I E' hE' d).mpr hd)
"""
