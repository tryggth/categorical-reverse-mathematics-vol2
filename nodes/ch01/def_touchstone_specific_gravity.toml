[spec]
statement = "Given a finite implication library I of schemas H_1,...,H_k => C over D, a carrier w surgically activates an implication (forms a minimal cut) when w satisfies every premise H_i while refuting C. Its Touchstone Specific Gravity is SG(w) := #{minimal cuts in I} / K_AST(w) (for K_AST(w) > 0), and any total-pathology carrier violating a premise in every implication in I achieves minimalCutCount = 0."

