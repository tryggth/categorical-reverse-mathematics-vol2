tex = """
\\begin{definition}[CRM Operational Currency Regimes]\\label{ch01:def:operational-currencies}%
\\uses{vol1:def:doctrinal-philosophy,ch01:thm:mode3-orbit-stabilizer-exactness}%
Relative to {{ref:vol1:def:doctrinal-philosophy}} and Mode~(iii) gauge symmetry ({{ref:ch01:thm:mode3-orbit-stabilizer-exactness}}), Volume~II classifies the operational cost of doctrinal reductions and Morita translations into four disjoint \\textbf{Operational Currency}\\index{Operational currency} regimes:
\\begin{enumerate}[label=\\textup{(\\arabic*)},leftmargin=2.0em]
  \\item \\textbf{Zero-Oracle Gauge Cost:} Purely computable symmetry-breaking or orbit-stabilizer accounting (for example, $(R_{2,2}, \\phi_{\\mathrm{aug}})$ Species enumeration) incurring zero non-computable oracles.
  \\item \\textbf{Oracle Cost:} Non-computable choice or realizability strength metered by Lawvere--Tierney topologies $j_{\\mathcal{O}}$ and extended Weihrauch degrees.
  \\item \\textbf{Rank-Compression Cost:} Quantifier-rank, tree-depth ($\\kappa^{\\mathbb{E}}$), or pebble-width ($\\kappa^{\\mathbb{P}}$) inflation $(a, b) \\in \\mathbb{N}_{\\ge 1} \\times \\mathbb{N}$ induced by syntactic bi-interpretations.
  \\item \\textbf{Inverted Clamping Cost:} Cohomological or L\\'evy-rank size-valve ceilings constraining universe growth and small-site reflection.
\\end{enumerate}
\\end{definition}
"""

