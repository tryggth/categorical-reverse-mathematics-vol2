lean_signature = """
private theorem oc_fin4_absurd {n : Nat} (h : n + 4 < 4) : False := Nat.not_lt_zero n
  (Nat.lt_of_succ_lt_succ (Nat.lt_of_succ_lt_succ (Nat.lt_of_succ_lt_succ
    (Nat.lt_of_succ_lt_succ h))))
/-- The four CRM Operational Currency regimes: (1) Zero-Oracle Gauge Cost, (2) Oracle Cost,
    (3) Rank-Compression Cost, and (4) Inverted Clamping Cost. -/
inductive OperationalCurrency : Type
  | zeroOracleGauge | oracleCost | rankCompression | invertedClamping
/-- Indicator of whether an operational currency invokes non-computable oracles. -/
def OperationalCurrency.usesOracle : OperationalCurrency → Bool
  | .zeroOracleGauge => false | .oracleCost => true
  | .rankCompression => false | .invertedClamping => false
/-- Canonical encoding `OperationalCurrency → Fin 4`. -/
def OperationalCurrency.toFin4 : OperationalCurrency → Fin 4
  | .zeroOracleGauge => ⟨0, by decide⟩ | .oracleCost => ⟨1, by decide⟩
  | .rankCompression => ⟨2, by decide⟩ | .invertedClamping => ⟨3, by decide⟩
/-- Canonical decoding `Fin 4 → OperationalCurrency`. -/
def OperationalCurrency.ofFin4 : Fin 4 → OperationalCurrency
  | ⟨0, _⟩ => .zeroOracleGauge | ⟨1, _⟩ => .oracleCost
  | ⟨2, _⟩ => .rankCompression | ⟨3, _⟩ => .invertedClamping
  | ⟨_ + 4, hn⟩ => False.elim (oc_fin4_absurd hn)
/-- Structured operational cost profile attaching distortion parameters to a currency. -/
structure CurrencyProfile : Type where
  /-- Active CRM operational currency regime. -/
  regime : OperationalCurrency
  /-- Multiplicative resource distortion slope `a ≥ 1`. -/
  slope : Nat
  /-- Additive resource distortion offset `b`. -/
  offset : Nat
  /-- Positivity witness for multiplicative distortion. -/
  slope_pos : 0 < slope
/-- Constructive bijection `OperationalCurrency ≃ Fin 4` certifying 4 disjoint regimes. -/
def operationalCurrencyEquivFin4 : OperationalCurrency ≃ Fin 4 where
  toFun := OperationalCurrency.toFin4; invFun := OperationalCurrency.ofFin4
  left_inv := fun r ↦ by
    {{LEAN_BODY}}
  right_inv := fun i ↦ by
    rcases i with ⟨_ | _ | _ | _ | _, hn⟩ <;> first | rfl | exact False.elim (oc_fin4_absurd hn)
/-- Exact oracle-usage partition across the four CRM Operational Currencies (zero axioms). -/
theorem operationalCurrency_oracle_partition :
    OperationalCurrency.usesOracle .zeroOracleGauge = false ∧
    OperationalCurrency.usesOracle .oracleCost = true ∧
    OperationalCurrency.usesOracle .rankCompression = false ∧
    OperationalCurrency.usesOracle .invertedClamping = false := ⟨rfl, rfl, rfl, rfl⟩
"""
