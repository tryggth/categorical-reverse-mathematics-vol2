[body]
tex = """
\\begin{table}[htbp]
\\centering
\\scriptsize
\\setlength{\\tabcolsep}{3.0pt}
\\renewcommand{\\arraystretch}{1.15}
\\begin{tabularx}{\\textwidth}{@{}P{0.20\\textwidth}P{0.22\\textwidth}YP{0.21\\textwidth}@{}}
\\toprule
\\textbf{Epistemic Regime} & \\textbf{Formal Criterion} & \\textbf{Structural Diagnostic \\& Filtration Dynamics} & \\textbf{Formal Anchor} \\\\
\\midrule
Provable Scotoma & $\\mathrm{Adm}_{{{sym:probe-suite}}} = \\emptyset$ & Every ${{sym:probe-suite}}$-closed extent covering $K$ leaks a defect $w \\in W$; probes obey Pre-Definition, Strict Non-Conservativity, and L\\'evy-Bounded $\\Sigma_1$ / small-site complexity preventing Vop\\v{e}nka reflection leaks. & {{ref:ch01:def:probe-suite}}, {{ref:ch01:def:adm-pareto-frontier}}, {{ref:ch01:thm:scotoma-pareto-trichotomy}} \\\\
Unique Residuum & $|{{sym:pareto-res}}| = 1$ & Unique inclusion-maximal admissible extent inside $T$ up to mutual inclusion. & {{ref:ch01:def:adm-pareto-frontier}}, {{ref:ch01:thm:scotoma-pareto-trichotomy}} \\\\
Pareto Schism & $|{{sym:pareto-res}}| \\ge 2$ & Incomparable maximal trade-offs in $\\mathrm{Adm}_{{{sym:probe-suite}}}$ ($\\neg(E_1 \\equiv E_2)$). & {{ref:ch01:def:adm-pareto-frontier}}, {{ref:ch01:thm:scotoma-pareto-trichotomy}} \\\\
Flow F1 Thresholds & ${{sym:twake}} \\le {{sym:tdogma}}$ & Every Dogma stage witnesses an Aperture via $T$; awakening always precedes dogma constructively. & {{ref:ch01:thm:flow-f1-threshold-order}} \\\\
Flow F1 Bifurcation / Unification & $|{{sym:pareto-res}}(\\mathcal{P}_t)|: 1 \\mapsto 2 \\mapsto 1$ & Intermediate probes split $\\{k_0, h_1\\}$ vs.\\ $\\{k_0, h_2\\}$ before a unifying probe $\\{k_0, h_1, h_2\\} \\subsetneq T$ restores $|{{sym:pareto-res}}| = 1$ inside $[{{sym:twake}}, {{sym:tdogma}})$. & {{ref:ch01:cex:flow-f1-frontier-nonmonotone}} \\\\
\\bottomrule
\\end{tabularx}
\\caption{Epistemic probe regimes, Pareto frontier trichotomy, and Flow~F1 calibration dynamics (Clauses~1--3).}
\\label{ch01:tab:epistemic-probe-regimes}
\\end{table}
"""

