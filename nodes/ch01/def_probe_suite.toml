[spec]
statement = "A doctrinal implication problem Phi = (H, C, K) over D induces Assertoric Closure T := (D \\ H) cup C and hard defects W := H \\ C. A calibrated probe suite P over Phi provides a decidable pairing I : D -> P -> Bool satisfying Clauses (1) Pre-Definition, (2) Strict Non-Conservativity, and (3) Levy-Bounded Size Discipline, together with Touchstone incidence hyperedges H_K(w) = {p | I w p = false}."
hypotheses = [
  "H1 (Pre-Definition): The probe predicate P is specified independently before inspecting T.",
  "H2 (Strict Non-Conservativity): For every probe p : P, there exists d : D separating (I d p = true) from (Phi.T d).",
  "H3 (Levy-Bounded Size Discipline): Every probe p : P carries a bounded Sigma_1 / small-site Levy complexity witness preventing Vopenka reflection leaks."
]

