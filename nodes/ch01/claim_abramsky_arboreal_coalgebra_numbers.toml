[spec]
statement = "By Abramsky (arXiv:2206.07393, §§3-6, pp. 6-20), Abramsky-Shah (JLC 31, 2021), Abramsky-Marsden (LICS 2021), Abramsky-Reggio (ICALP 2021, §§3-4), Dawar-Jakl-Reggio (LICS 2021, Thm. 11), and Reggio (arXiv:2110.11061, Thm. 4.6), finite-model-theoretic combinatorial games organize into a three-tier game-comonad hierarchy (Ehrenfeucht-Fraisse E_k, pebbling P_k, and modal/guarded/hybrid comonads) in arboreal and polyadic categories whose coalgebra numbers recover tree-depth kappa^E = td and tree-width kappa^P = tw + 1 and admit Lovasz-type homomorphism-counting probes."

[body]
tex = """
\\begin{inlineclaim}[Game-Comonad Hierarchy, Coalgebra Numbers, and Polyadic Lov\\'asz Probes]\\label{ch01:claim:abramsky-arboreal-coalgebra-numbers}%
\\uses{ch01:def:operational-currencies}%
In Abramsky's Structure-and-Power program~\\cite[\\S\\S 3--6, pp.~6--20]{abramsky2022}, syntactic resource bounds correspond functorially to a three-tier game-comonad hierarchy---the Ehrenfeucht--Fra\\\"iss\\'e comonad {{sym:ef-comonad}} (quantifier rank), the pebble comonad {{sym:pebble-comonad}} (bounded variable width), and modal/guarded/hybrid fragment comonads~\\cite{abramsky_shah2021,abramsky_marsden2021}---inside arboreal categories~\\cite[\\S\\S 3--4]{abramsky_reggio2021}. Their coalgebra numbers recover exact combinatorial invariants, $\\kappa^{\\mathbb{E}}(A) = \\mathrm{td}(A)$ (tree-depth) and $\\kappa^{\\mathbb{P}}(A) = \\mathrm{tw}(A) + 1$ (tree-width plus one), while polyadic and arboreal Lov\\'asz-type theorems characterize resource-bounded equivalence via homomorphism-counting probe families~\\cite[Thm.~11]{dawar_jakl_reggio2021}\\cite[Thm.~4.6]{reggio2021}.
\\end{inlineclaim}
"""

