/-- Doctrinal domain `(D, mul, zero, boxSigma)` with Alexandrov S4 interior operator. -/
structure DoctrinalDomain (D : Type) where
  /-- Binary doctrinal product `×`. -/
  mul : D → D → D
  /-- Terminal / trivial doctrine `0` (`1`). -/
  zero : D
  /-- Modal S4 stability interior `Box_Σ : Set D → Set D`. -/
  boxSigma : Set D → Set D
  /-- S4 Axiom T (deflation): `Box_Σ(U) ⊆ U`. -/
  box_deflate : ∀ U d, boxSigma U d → U d
  /-- S4 Monotonicity: `U ⊆ V → Box_Σ(U) ⊆ Box_Σ(V)`. -/
  box_mono : ∀ {U V : Set D}, (∀ d, U d → V d) → ∀ d, boxSigma U d → boxSigma V d
  /-- S4 Axiom 4 (idempotence): `Box_Σ(U) ⊆ Box_Σ(Box_Σ(U))`. -/
  box_idem : ∀ U d, boxSigma U d → boxSigma (boxSigma U) d
  /-- Alexandrov intersection preservation for monoid-stability interiors `Box_Σ`. -/
  box_sInter : ∀ (F : Set (Set D)) (d : D),
    (∀ U, F U → boxSigma U d) → boxSigma (fun x ↦ ∀ U, F U → U x) d

/-- Non-trivial doctrinal problem `(H, C, K)` witnessing `H ⊈ C`. -/
structure NonTrivialProblem (D : Type) extends DoctrinalProblem D where
  /-- Explicit defect witness `w ∈ H \\ C`. -/
  hasDefect : ∃ w, H w ∧ ¬ C w

/-- Set-theoretic Assertoric Closure `T := (D \\ H) ∪ C`. -/
def AssertoricSet {D : Type} (Φ : DoctrinalProblem D) : Set D := fun d ↦ ¬ Φ.H d ∨ Φ.C d
/-- Off-core locus `(D \\ H) ∪ K`. -/
def OffCoreSet {D : Type} (Φ : DoctrinalProblem D) : Set D := fun d ↦ ¬ Φ.H d ∨ Φ.K d
/-- Axiom (P3) on a single extent: `zero ∈ E` and `mul`-closure. -/
def IsMultiplicative {D : Type} (dom : DoctrinalDomain D) (E : Set D) : Prop :=
  E dom.zero ∧ ∀ d₁ d₂, E d₁ → E d₂ → E (dom.mul d₁ d₂)
/-- Axiom (P4) on a single extent: modal `Σ`-exactness `Box_Σ(E) = E`. -/
def IsModalExact {D : Type} (dom : DoctrinalDomain D) (E : Set D) : Prop :=
  ∀ d, dom.boxSigma E d ↔ E d
/-- Axiom (P5) on a single extent: `Box_Σ((D \\ H) ∪ K) ⊆ E → E = ⊤`. -/
def IsOffCoreDiscerning {D : Type} (dom : DoctrinalDomain D)
    (Φ : DoctrinalProblem D) (E : Set D) : Prop :=
  (∀ d, dom.boxSigma (OffCoreSet Φ) d → E d) → ∀ d, E d
/-- An `ι`-indexed extensive, `Σ`-invariant, off-core discerning probe family. -/
def IsAdmissibleProbeFamily {D ι : Type} (dom : DoctrinalDomain D)
    (Φ : DoctrinalProblem D) (P : ι → Set D) : Prop :=
  ∀ i, IsMultiplicative dom (P i) ∧ IsModalExact dom (P i) ∧ IsOffCoreDiscerning dom Φ (P i)
/-- Extent family `ℳ` generated by intersections of a probe family `P : ι → Set D`. -/
def GeneratedByProbes {D ι : Type} (P : ι → Set D) (M : Set (Set D)) : Prop :=
  ∀ E : Set D, M E ↔ ∃ S : Set ι, ∀ d, E d ↔ ∀ i, S i → P i d
/-- Intrinsic axiom (P1): extensional `⋂`-closure and `ι`-indexed `⋂`-density. -/
def ZeroGiraudP1 {D ι : Type} (M : Set (Set D)) : Prop :=
  (∀ E₁ E₂ : Set D, (∀ d, E₁ d ↔ E₂ d) → M E₁ → M E₂) ∧
  (∀ F : Set (Set D), (∀ E, F E → M E) → M (fun d ↦ ∀ E, F E → E d)) ∧
  ∃ G : ι → Set D, (∀ i, M (G i)) ∧ ∀ E, M E → ∀ d, (∀ i, (∀ x, E x → G i x) → G i d) → E d
/-- Intrinsic axiom (P3): every extent in `ℳ` is multiplicative. -/
def ZeroGiraudP3 {D : Type} (dom : DoctrinalDomain D) (M : Set (Set D)) : Prop :=
  ∀ E, M E → IsMultiplicative dom E
/-- Intrinsic axiom (P4): every extent in `ℳ` is modal `Σ`-exact. -/
def ZeroGiraudP4 {D : Type} (dom : DoctrinalDomain D) (M : Set (Set D)) : Prop :=
  ∀ E, M E → IsModalExact dom E
/-- Intrinsic axiom (P5): every extent in `ℳ` satisfies off-core discernment. -/
def ZeroGiraudP5 {D : Type} (dom : DoctrinalDomain D) (Φ : DoctrinalProblem D)
    (M : Set (Set D)) : Prop := ∀ E, M E → IsOffCoreDiscerning dom Φ E

/-- **0-Giraud Representation Theorem (Constructive, Emerald):** `ℳ` arises from an
    `ι`-indexed extensive, `Σ`-invariant, off-core discerning probe family iff `ℳ`
    satisfies intrinsic axioms (P1), (P3), (P4), and (P5) (zero axioms). -/
theorem zero_giraud_representation {D ι : Type} (dom : DoctrinalDomain D)
    (Φ : DoctrinalProblem D) (M : Set (Set D)) :
    (∃ P : ι → Set D, IsAdmissibleProbeFamily dom Φ P ∧ GeneratedByProbes P M) ↔
    (ZeroGiraudP1 (ι := ι) M ∧ ZeroGiraudP3 dom M ∧
      ZeroGiraudP4 dom M ∧ ZeroGiraudP5 dom Φ M) := by
  {{LEAN_BODY}}

/-- Contrapositive formulation of (P5): any non-top `E ∈ ℳ` omits `Box_Σ((D \\ H) ∪ K)`. -/
theorem p5_contrapositive {D : Type} (dom : DoctrinalDomain D)
    (Φ : DoctrinalProblem D) (M : Set (Set D)) (hP5 : ZeroGiraudP5 dom Φ M)
    {E : Set D} (hME : M E) (hNotTop : ¬ ∀ d, E d) :
    ¬ ∀ d, dom.boxSigma (OffCoreSet Φ) d → E d := fun hSub ↦ hNotTop (hP5 E hME hSub)

/-- **(P5) Simultaneous Banishment:** Off-core discernment banishes both Dogma (`T ∉ ℳ`)
    and Immortal Casuistry (`Box_Σ(T) ∉ ℳ`) constructively (zero axioms). -/
theorem p5_banishes_dogma_and_casuistry {D : Type} (dom : DoctrinalDomain D)
    (Φ : NonTrivialProblem D) (M : Set (Set D)) (hP5 : ZeroGiraudP5 dom Φ.toDoctrinalProblem M) :
    ¬ M (AssertoricSet Φ.toDoctrinalProblem) ∧
    ¬ M (dom.boxSigma (AssertoricSet Φ.toDoctrinalProblem)) ∧
    ¬ M Φ.toDoctrinalProblem.T ∧ ¬ M (dom.boxSigma Φ.toDoctrinalProblem.T) := by
  have hS : ∀ d, OffCoreSet Φ.toDoctrinalProblem d → AssertoricSet Φ.toDoctrinalProblem d :=
    fun d h ↦ Or.elim h Or.inl (fun hk ↦ Or.inr (Φ.core_sub_concl d hk))
  have hI : ∀ d, OffCoreSet Φ.toDoctrinalProblem d → Φ.toDoctrinalProblem.T d :=
    fun d h hh ↦ Or.elim h (fun hnh ↦ False.elim (hnh hh)) (fun hk ↦ Φ.core_sub_concl d hk)
  rcases Φ.hasDefect with ⟨w, hwH, hwNC⟩
  refine ⟨fun h ↦ ?_, fun h ↦ ?_, fun h ↦ ?_, fun h ↦ ?_⟩
  · exact Or.elim (hP5 _ h (fun d hd ↦ hS d (dom.box_deflate _ d hd)) w) (· hwH) hwNC
  · exact Or.elim (dom.box_deflate _ w (hP5 _ h (dom.box_mono hS) w)) (· hwH) hwNC
  · exact hwNC (hP5 _ h (fun d hd ↦ hI d (dom.box_deflate _ d hd)) w hwH)
  · exact hwNC (dom.box_deflate _ w (hP5 _ h (dom.box_mono hI) w) hwH)
"""
