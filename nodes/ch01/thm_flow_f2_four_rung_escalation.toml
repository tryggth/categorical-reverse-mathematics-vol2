[spec]
statement = "For T = Mod(IAC -> AC) in Topos, closing under trivial, open-subtopos, Lawvere-Tierney sheaf, and slice+LT operations yields a strict four-rung escalation C_triv > C_open > C_LT > C_slice+LT, separated explicitly by Set^{(B(Z/2Z))_bot}, Set^{(B(Z/2Z))^top}, Set^{(Z/2Z)^0}, and Set^{M_1}/X. Moreover, etale slicing over a 3-point M_1-set X = {u1, u2, z} collapses Proj_sub inside Set^{M_1}/X."

