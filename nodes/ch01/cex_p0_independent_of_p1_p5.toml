lean_signature = """
private theorem nat_lt3_0 : 0 < 3 := Nat.zero_lt_succ 2
private theorem nat_lt3_1 : 1 < 3 := Nat.succ_lt_succ (Nat.zero_lt_succ 1)
private theorem nat_lt3_2 : 2 < 3 := Nat.succ_lt_succ (Nat.succ_lt_succ (Nat.zero_lt_succ 0))
private theorem fin4_absurd {n : Nat} (h : n + 4 < 4) : False := Nat.not_lt_zero n
  (Nat.lt_of_succ_lt_succ (Nat.lt_of_succ_lt_succ (Nat.lt_of_succ_lt_succ
    (Nat.lt_of_succ_lt_succ h))))

/-- Join-semilattice product `max` on `Fin 4` (`0 < 1 < 2 < 3` modeling `{0 < k < w < h}`). -/
def p0CexMul (a b : Fin 4) : Fin 4 := if a.val ≤ b.val then b else a

/-- Four-element doctrinal domain `(Fin 4, max, 0, id)`. -/
def p0CexDomain : DoctrinalDomain (Fin 4) where
  mul := p0CexMul; zero := ⟨0, Nat.zero_lt_succ 3⟩; boxSigma := fun U ↦ U
  box_deflate := fun _ _ h ↦ h; box_mono := fun h _ hd ↦ h _ hd
  box_idem := fun _ _ h ↦ h; box_sInter := fun _ _ h ↦ h

/-- Four-element problem `H = {0,1,2}`, `C = K = {0,1}`, `T = {0,1,3}`, defect `w = 2`. -/
def p0CexProblem : NonTrivialProblem (Fin 4) where
  H := fun d ↦ d.val < 3; C := fun d ↦ d.val < 2; K := fun d ↦ d.val < 2
  core_sub_hyp := fun _ h ↦ Nat.lt_trans h (Nat.lt_succ_self 2); core_sub_concl := fun _ h ↦ h
  hasDefect := ⟨⟨2, Nat.succ_lt_succ (Nat.succ_lt_succ (Nat.zero_lt_succ 1))⟩,
    nat_lt3_2, fun h ↦ Nat.not_lt_zero 0 (Nat.lt_of_succ_lt_succ (Nat.lt_of_succ_lt_succ h))⟩

/-- Single probe cutting `{0, 1, 2}` inside `Fin 4`. -/
def p0CexProbe : Unit → Set (Fin 4) := fun _ d ↦ d.val < 3

/-- Extent family `ℳ = {D, {0,1,2}}` generated by `p0CexProbe`. -/
def p0CexFamily : Set (Set (Fin 4)) :=
  fun E ↦ ∃ S : Set Unit, ∀ d, E d ↔ ∀ i, S i → p0CexProbe i d

/-- Computable `Bool` encoding of the two extents `{0,1,2}` (`false`) and `Fin 4` (`true`). -/
def p0CexBoolExt (isTop : Bool) (d : Fin 4) : Bool := isTop || decide (d.val < 3)

/-- `p0CexProbe` is extensive, `Σ`-invariant, and off-core discerning (zero axioms). -/
theorem p0CexProbe_admissible :
    IsAdmissibleProbeFamily p0CexDomain p0CexProblem.toDoctrinalProblem p0CexProbe := by
  intro _
  refine ⟨⟨nat_lt3_0, fun d₁ d₂ h₁ h₂ ↦ ?_⟩, fun _ ↦ Iff.rfl, fun hOff _ ↦ ?_⟩
  · dsimp only [p0CexDomain, p0CexMul, p0CexProbe]; split <;> assumption
  · exact False.elim (Nat.lt_irrefl 3 (hOff ⟨3, Nat.lt_succ_self 3⟩ (Or.inl (Nat.lt_irrefl 3))))

/-- Constructive (P2) for `p0CexFamily` on nonempty directed families decidable at `3`. -/
theorem p0Cex_P2_decidable (c : Set (Set (Fin 4)))
    (hcM : ∀ E, c E → p0CexFamily E) (hcNe : c.Nonempty)
    (hDec : Decidable (Set.sUnion c ⟨3, Nat.lt_succ_self 3⟩)) :
    p0CexFamily (Set.sUnion c) := by
  rcases hcNe with ⟨E₀, hE₀⟩; rcases hcM E₀ hE₀ with ⟨S₀, hS₀⟩
  match hDec with
  | isTrue h3 =>
    refine ⟨fun _ ↦ False, fun d ↦ ⟨fun _ _ hf ↦ False.elim hf, fun _ ↦ ?_⟩⟩
    rcases d with ⟨_ | _ | _ | _ | n, hdv⟩
    · exact ⟨E₀, hE₀, (hS₀ ⟨0, hdv⟩).mpr (fun _ _ ↦ nat_lt3_0)⟩
    · exact ⟨E₀, hE₀, (hS₀ ⟨1, hdv⟩).mpr (fun _ _ ↦ nat_lt3_1)⟩
    · exact ⟨E₀, hE₀, (hS₀ ⟨2, hdv⟩).mpr (fun _ _ ↦ nat_lt3_2)⟩
    · exact h3
    · exact False.elim (fin4_absurd hdv)
  | isFalse hn3 =>
    refine ⟨fun _ ↦ True, fun d ↦ ⟨fun hd _ _ ↦ ?_, fun hlt ↦ ?_⟩⟩
    · rcases d with ⟨_ | _ | _ | _ | n, hdv⟩
      · exact nat_lt3_0
      · exact nat_lt3_1
      · exact nat_lt3_2
      · exact False.elim (hn3 hd)
      · exact False.elim (fin4_absurd hdv)
    · exact ⟨E₀, hE₀, (hS₀ d).mpr (fun _ _ ↦ hlt () trivial)⟩

/-- Unconditional (P2) on finite computable chains of Boolean extents in `{ {0,1,2}, Fin 4 }`. -/
theorem p0Cex_P2_bool (cs : List Bool) (hne : cs ≠ []) (d : Fin 4) :
    cs.any (fun b ↦ p0CexBoolExt b d) = p0CexBoolExt (cs.any id) d := by
  induction cs with
  | nil => exact False.elim (hne rfl)
  | cons a tl ih =>
    cases tl with
    | nil => dsimp only [List.any, p0CexBoolExt, id]; cases a <;> cases decide (d.val < 3) <;> rfl
    | cons b rest =>
      change (p0CexBoolExt a d || (b :: rest).any (fun x ↦ p0CexBoolExt x d)) =
        p0CexBoolExt (a || (b :: rest).any id) d
      rw [ih (fun h ↦ by cases h)]; dsimp only [p0CexBoolExt]
      cases a <;> cases (b :: rest).any id <;> cases decide (d.val < 3) <;> rfl

/-- **Independence of (P0) from (P1)–(P5):** On `Fin 4`, `p0CexFamily` satisfies (P1),
    constructive (P2), (P3), (P4), and (P5), yet violates (P0) (`2 ∈ c_ℳ(K) \\ T`) and has
    empty Living Zone `ℱ = ∅` (zero axioms). -/
theorem p0_independent_of_p1_p5 :
    ZeroGiraudP1 (ι := Unit) p0CexFamily ∧ ZeroGiraudP3 p0CexDomain p0CexFamily ∧
    ZeroGiraudP4 p0CexDomain p0CexFamily ∧
    ZeroGiraudP5 p0CexDomain p0CexProblem.toDoctrinalProblem p0CexFamily ∧
    (∀ cs : List Bool, cs ≠ [] → ∀ d : Fin 4,
      cs.any (fun b ↦ p0CexBoolExt b d) = p0CexBoolExt (cs.any id) d) ∧
    mooreClosureOf p0CexFamily p0CexProblem.K ⟨2, by decide⟩ ∧
    ¬ AssertoricSet p0CexProblem.toDoctrinalProblem ⟨2, by decide⟩ ∧
    ¬ ZeroGiraudP0 p0CexFamily p0CexProblem.K (AssertoricSet p0CexProblem.toDoctrinalProblem) ∧
    (∀ E, ¬ InLivingZone p0CexFamily p0CexProblem.K
        (AssertoricSet p0CexProblem.toDoctrinalProblem) E) := by
  {{LEAN_BODY}}
"""
