[spec]
statement = "On the 4-element join-semilattice D = Fin 4 (0 < 1 < 2 < 3 modeling {0 < k < w < h}, mul = max, zero = 0, boxSigma = id) with H = {0,1,2}, C = K = {0,1}, T = {0,1,3}, defect w = 2, and extent family M = {D, {0,1,2}}, M satisfies (P1) intersection-density, constructive (P2) directed-union closure, (P3) multiplicativity, (P4) modal Sigma-exactness, and (P5) off-core discernment, while violating (P0) (2 in c_M(K) \\ T) and leaving the Living-Zone poset F empty (zero axioms, Emerald)."

