[spec]
statement = "By Kihara (Trans. AMS Ser. B 10, 2023, Thms. 1.3 & 3.14, §4), the Lawvere-Tierney lattice LTT(Eff) is isomorphic to extended generalized Weihrauch degrees W_{gen,ext}, its proper cone {j > id_Omega} forms an upward Evanescent Residuum with no minimal element strictly above id_Omega, and Muchnik meets of Turing-incomparable non-computable oracles satisfy j_{O_1} /\\ j_{O_2} > id_Omega (Guardrail 3). Maschio-Trotta (Ann. Pure Appl. Logic 2026, §4) establish that the extended Weihrauch doctrine eW forms a tripos whose realizability topos recovers relative realizability subtoposes Sh_j."

[body]
tex = """
\\begin{inlineclaim}[Kihara--Maschio--Trotta Weihrauch--LTT Duality and Guardrail~3]\\label{ch01:claim:kihara-ew-weihrauch-ltt-duality}%
\\uses{vol1:def:doctrinal-philosophy}%
Inside Martin Hyland's Effective Topos $\\Eff$~\\cite{Hyland82}, Kihara~\\cite[Thms.~1.3 \\&~3.14, \\S 4]{kihara2023} proves a lattice isomorphism $\\mathbf{LTT}(\\Eff) \\cong \\mathcal{W}_{\\mathrm{gen,ext}}$ with extended generalized Weihrauch degrees, showing that the proper cone $\\{j > \\mathrm{id}_\\Omega\\}$ is an upward \\textbf{Evanescent Residuum} possessing no minimal element strictly above $\\mathrm{id}_\\Omega$ (resolving Lee--van~Oosten~\\cite{LeeVanOosten13}) while Turing-incomparable non-computable oracles satisfy the non-trivial Muchnik meet bound $j_{\\mathcal{O}_1} \\wedge j_{\\mathcal{O}_2} > \\mathrm{id}_\\Omega$ (Guardrail~3). Complementarily, Maschio and Trotta~\\cite[\\S 4]{maschio_trotta2026} show that the extended Weihrauch doctrine $\\mathsf{eW}$ forms a tripos whose topos recovers relative realizability topoi as Lawvere--Tierney sheaf subtopoi $\\mathbf{Sh}_j$.
\\end{inlineclaim}
"""

