\\begin{table}[htbp]
\\centering
\\scriptsize
\\setlength{\\tabcolsep}{2.6pt}
\\renewcommand{\\arraystretch}{1.14}
\\begin{tabularx}{\\textwidth}{@{}P{0.17\\textwidth}P{0.19\\textwidth}P{0.19\\textwidth}YY@{}}
\\toprule
\\textbf{Vertical Rung} & \\textbf{Categorical Operations} & \\textbf{$\\mathcal{L}_\\in$-Conservativity} & \\textbf{Operational Currencies \\& Anchors} & \\textbf{Key Reference} \\\\
\\midrule
{{sym:gb0}} (Replacement-free) & Coreflective ${{sym:def-functor}} \\dashv {{sym:piset}}$; 3-way $f^*\\mathcal{D}$ failure & Yes over $\\mathsf{Z}$ via ${{sym:def-functor}}(M)$ & Inverted Clamping / Rank-Compression baseline ({{ref:ch01:def:operational-currencies}}) & {{ref:ch02:def:gb0-model-category}}, {{ref:ch02:thm:three-way-pullback-failure}}, {{ref:ch02:thm:def-left-adjoint-coreflection}}, {{ref:ch02:prop:syntactic-conservative-pullback}} \\\\
{{sym:gbc}} (${{sym:gb0}} + \\mathrm{Rep} + \\mathrm{AC}$) & Predicative \\textbf{G1--G8}; $\\mathbf{Card} \\hookrightarrow \\mathbf{Set}$ unsplit under Easton & Yes over $\\mathsf{ZFC}$ via ${{sym:def-functor}}(M)$ & Unsplit weak equivalence under $\\forall p\\,(V \\neq \\mathrm{HOD}(\\{p\\}))$ & {{ref:ch02:prop:los-unbundling-independence}}, {{ref:ch02:claim:easton-hod-unsplit-card}}, {{ref:ch02:thm:williams-fixed-set-kaleidoscope}} \\\\
{{sym:nbg}} (${{sym:gbc}} + \\mathsf{GC} = {{sym:gb0}} + \\mathsf{LoS}$) & Splits $\\mathbf{Card} \\hookrightarrow \\mathbf{Set}$; $\\mathrm{Ord} \\xrightarrow{\\sim} V$ & Yes over $\\mathsf{ZFC}$ (Felgner~\\cite{felgner1971}) & Oracle Cost (Global Choice selector $\\mathsf{GC}$) & {{ref:ch02:prop:los-unbundling-independence}}, {{ref:ch02:claim:easton-hod-unsplit-card}} \\\\
${{sym:nbg}} + {{sym:etr-ord}}$ & Class forcing $\\Vdash_{\\mathbb{P}}$; $\\mathrm{Ord}$-Ad\\'amek chains & \\textbf{No} over $\\mathsf{ZFC}$ ($\\mathsf{ETR}_\\omega \\vdash \\mathrm{Con}(\\mathsf{ZFC})$ vs.\\ $\\mathsf{CT}^-[\\mathsf{ZFC}]$~\\cite{fujimoto2012}); yes over $T^*$ & Reflection leak vs.\\ $T^*$ (\\cite{gitman2020} write $\\mathsf{GBC}$ for ${{sym:nbg}}$) & {{ref:ch02:claim:gitman-etr-ord-fujimoto-contrast}} \\\\
${{sym:nbg}} + \\mathsf{ETR}$ & Arbitrary class well-order recursion & \\textbf{No} ($\\vdash \\mathrm{Con}({{sym:nbg}} + {{sym:etr-ord}})$) & Oracle + Rank-Compression escalation & {{ref:ch02:claim:gitman-etr-ord-fujimoto-contrast}} \\\\
{{sym:km}} ($\\Pi^1_\\infty$-\\textsf{CA}) & Complete class lattices; still blocked from class-sized $\\mathbf{Set}$-limits / Kan ext.~\\cite{maclane1998} & \\textbf{No} ($\\vdash \\mathrm{Con}({{sym:nbg}} + \\mathsf{ETR})$, modeled by $(V_\\kappa, V_{\\kappa+1})$) & Inverted Clamping ($V_\\lambda \\ni V_\\kappa$ Grothendieck universe required) & {{ref:ch02:claim:kelley-morse-freyd-kan-barrier}} \\\\
\\bottomrule
\\end{tabularx}
\\caption{Six-rung vertical class-theory spectrum along ${{sym:piset}}^{-1}(M)$ above $\\mathbf{Set}_M$, contrasting categorical power, $\\mathcal{L}_\\in$-conservativity, and Operational Currencies.}
\\label{ch02:tab:vertical-class-spectrum}
\\end{table}
"""

