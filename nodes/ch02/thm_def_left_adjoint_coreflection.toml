[spec]
statement = "Over set universes M equipped with first-order definable Subclass Separation (DefAlgebra), minimal Godel-expression expansion Def(M) forms a functor Def : DefAlgebra -> GB0Model left adjoint to pi_Set (Def -| pi_Set) via a natural hom-bijection Hom_{GB0}(Def(M), Y) ~= Hom_Set(M, pi_Set(Y)) with identity unit eta_M : M ~= pi_Set(Def(M)) and vertical inclusion counit eps_{(M,C)} : Def(M) >-> (M, C). In particular, Def embeds DefAlgebra as a full coreflective subcategory of Mod(GB_0) with coreflector pi_Set, and Def(M) is initial in every vertical fiber pi_Set^{-1}(M)."
hypotheses = [
  "M : DefAlgebra (SetBase satisfying Subclass Separation on Godel-definable classes)",
  "Y : GB0Model"
]

