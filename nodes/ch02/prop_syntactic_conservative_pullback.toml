[spec]
statement = "In contrast to semantic model-space pullback failure (Theorem ch02:thm:three-way-pullback-failure), inside the syntactic interpretability preorder of two-sorted class theories (T_set, T_cls) equipped with the adjunction Def_syn -| Tr_set (where Tr_set extracts first-order L_in-set theorems), whenever T_0 <= T_1, E_0 is L_in-conservative over T_0 (Tr_set(E_0) == T_0), and E_1 == Def_syn(T_1) sup E_0, the pushout square forms a genuine pullback square against minimal class extensions Def_syn(X) and on set traces. Conversely, any non-conservative set leak X <= Tr_set(L_0) with X <= T_1 and not (X <= T_0) destroys the pullback square (previewing Chapter 3 when Replacement or Foundation is dropped)."
hypotheses = [
  "Sys : SyntacticClassSystem with TheoryJoinPreorder SetTh, ClsTh and Galois adjunction Def_syn -| Tr_set (with Def_syn conservative)",
  "hT : T_0 <= T_1, hCons : IsConservativeExt Sys E_0 T_0, hPush : ClsTh.Equiv E_1 (ClsTh.sup (defSyn T_1) E_0)"
]

