[spec]
statement = "Over Replacement-free, Choice-free GB_0, von Neumann's Limitation of Size (LoS: every class C is either small or surjects onto V, and not both) is strictly equivalent to the conjunction of Class Replacement (Rep) and Global Choice (GC). Moreover, over GB_0, Rep and GC are mutually independent: (Rep /\\ ~GC /\\ ~LoS) holds in tail Easton models with no definable selector, and (GC /\\ ~Rep /\\ ~LoS) holds in Godel's countable-cofinality constructible spine (L_{omega_omega^L}, Def(L_{omega_omega^L}))."
hypotheses = [
  "S : GB0ClassSystem modeling GB_0 with small sets, classes, Ord, admissible class functions, and diagonal separation",
  "repNoGCModel : GB0ClassSystem (hereditarily finite tagged universe RepObj with tag-preserving maps)",
  "gcNoRepModel : GB0ClassSystem (countable-cofinality ordinal spine modeling (L_{omega_omega^L}, Def(L_{omega_omega^L})))"
]

