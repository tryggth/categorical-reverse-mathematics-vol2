  "finTailModel : GB0Model (finitely supported tail-constant subsets of Nat plus inductive pairs)",
  "fullNatModel : GB0Model (all subsets of Nat via TailSet + Set Nat plus inductive pairs)",
  "finToFull : FinTailCarrier -> FullNatCarrier injective, mem-preserving, and pair-preserving"
]

