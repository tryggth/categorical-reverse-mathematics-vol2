[spec]
statement = "Over Mod(GB_0), naive trace pullback f^*D := {f^{-1}[D] | D in D} along an in- and pair-preserving embedding f : M_fin -> M_full fails simultaneously along three independent obstructions, blocking Cartesian lifts for pi_Set: (1) Subclass Separation Leak: evenNat in Def(M_full) pulls back onto a bounded subset of omega in M_fin with no representing set in M_fin; (2) Godel G4 Domain-Projection Failure: for D = {(f(x_0), y_0)} with external witness y_0 not in range(f), dom^{M_fin}(f^{-1}[D]) = empty != {x_0} = f^{-1}[dom^{M_full}(D)]; (3) Preimage Collapse: distinct classes empty != {y_0} in D satisfy f^{-1}[empty] = empty = f^{-1}[{y_0}], blocking unique Cartesian mediating lifts."
