[spec]
statement = "By Williams's Fixed-Set Universality Theorem (Williams 2018, Ch. 2-3 / Main Theorem), holding any countable model M |= ZFC completely rigid via id_M, the vertical fiber poset pi_Set^{-1}(M) of GBC-realizations (M, C) ordered by class inclusion embeds every countable partial order. Abstracting the underlying algebraic mechanism, given any partial order (P, <=) and an IndependentClassFamily F over a fixed base M, the principal-ideal map p |-> cl(down p) defines a strict OrderEmbedding P >->o FixedSetFiber M holding base = M identically rigid; moreover, every Nat-indexed countable partial order embeds into a Boolean-closed finitely-supported fiber over Nat x Bool."
hypotheses = [
  "F : IndependentClassFamily M P over a partial order [PartialOrder P] and fixed set base M",
  "External forcing theorem [williams2018]: over any countable M |= ZFC, product class forcing yields mutually generic GBC-closed independent proper classes"
]

